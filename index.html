  // ---------- 2.13 ----------
  { sec: "2.13 Data types", title: "Data types",
    body: "Common data types: integer (whole numbers), float (real numbers), character (one symbol like 'A'), string (a sequence of characters like \"Hello\"), Boolean (only true or false), and array (an ordered list of one type). Coral variables support integer, float, and array.",
    example: "integer   → 42\nfloat     → 98.6\ncharacter → 'A'\nstring    → \"Hello\"\nBoolean   → true / false",
    note: "A Boolean has exactly two values: true or false." },

  // ---------- 2.14 ----------
  { sec: "2.14 Constants", title: "Constants",
    body: "A constant is a named value that CANNOT change once set — the opposite of a variable. Use constants for fixed values (pi, a tax rate) so a number isn't repeated as a mystery literal. Convention: name them in UPPER_CASE with underscores.",
    example: "SEC_PER_HOUR = 3600\nPRICE_DISCOUNT = 5",
    note: "Variable = can change; constant = fixed. Naming: UPPER_CASE_WITH_UNDERSCORES." },

  // ================= CHAPTER 3 — Branches (3.1–3.8) =================
  // ---------- 3.1 ----------
  { sec: "3.1 Branches", title: "Branches & if-else",
    body: "A branch is a sequence of statements that runs only when a condition is true. An if-else branch works like this: IF the condition is true, the first (if) block runs; otherwise the else block runs. Exactly one of the two runs. An \"if branch\" is just an if with no else.",
    example: "if userAge < 25\n   insurePrice = 4800\nelse\n   insurePrice = 2200",
    note: "MEMORY HOOK: if-else = one door OR the other. Exactly one branch always runs." },
  { sec: "3.1 Branches", title: "if-elseif chains",
    body: "An if-elseif-else checks conditions top to bottom. The FIRST condition that is true runs its block, and the rest are skipped — so exactly one branch runs. The final else is the catch-all when nothing matched.",
    example: "if numYears == 1\n   Put \"Newlyweds\" to output\nelseif numYears == 25\n   Put \"Silver\" to output\nelse\n   Put \"Congrats\" to output",
    note: "EXAM TRAP: only ONE branch of an if-elseif runs — the first true one. Order matters." },

  // ---------- 3.2 ----------
  { sec: "3.2 More branches", title: "Nested & multiple branches",
    body: "A branch can contain another branch — that's a nested branch. Separately, several DISTINCT if statements in a row are each independent, so more than one can run — unlike an if-elseif chain where only one runs.",
    example: "if age > 15\n   Put \"drive\" to output\nif age > 17\n   Put \"vote\" to output\n// age 18 prints BOTH",
    note: "EXAM TRAP: if-elseif = exactly one runs. Separate ifs = several can run." },

  // ---------- 3.3 ----------
  { sec: "3.3 Equality & relational operators", title: "Equality operators == and !=",
    body: "The equality operator == is true when both sides are equal; != is true when they differ. An expression using these evaluates to a Boolean (true or false). Equality works for integers, but should NOT be used to compare floats because floats are stored imprecisely.",
    example: "x == 3   // true when x is 3\nx != 3   // true when x is not 3",
    note: "EXAM TRAP: equality is ==, NOT =. And don't use == on floats." },
  { sec: "3.3 Equality & relational operators", title: "The four relational operators",
    body: "Relational operators compare how one value relates to another: < (less-than), > (greater-than), <= (less-or-equal), >= (greater-or-equal). Only these exact two-character sequences are valid — you can't rearrange the symbols.",
    example: "x < 4    x > 2\nx <= 3   x >= 3",
    note: "EXAM TRAP: it's <= and >=, never =< or =>. Those are invalid." },

  // ---------- 3.5 ----------
  { sec: "3.5 Logical operators", title: "Logical and, or, not",
    body: "Logical operators combine true/false values. (a) and (b) is true only when BOTH are true. (a) or (b) is true when AT LEAST ONE is true. not(a) flips true to false and vice-versa. Coral writes them as the words and, or, not.",
    example: "(x > 0) and (y < 10)\n(x < 0) or  (y > 5)\nnot(x < 0)",
    note: "MEMORY HOOK: and = both, or = either, not = flip." },
  { sec: "3.5 Logical operators", title: "Range checks need 'and'",
    body: "To test whether a value is inside a range, combine two comparisons with and. You CANNOT chain comparisons like math (0 < x < 10 is wrong). Write it as two conditions joined by and.",
    example: "// x between 0 and 10:\n(0 < x) and (x < 10)",
    note: "EXAM TRAP: 0 < x < 10 is invalid. Use (0 < x) and (x < 10)." },

  // ---------- 3.6 ----------
  { sec: "3.6 Order of evaluation", title: "Operator precedence",
    body: "When operators mix, Coral evaluates in this order, high to low: parentheses, then not, then arithmetic (* / % + -), then relational (< <= > >=), then equality (== !=), then and, then or. Equal-precedence operators go left to right.",
    example: "x == 5 or y == 10 and z != 10\n→ (x==5) or ((y==10) and (z!=10))",
    note: "EXAM TRAP: among logicals, not > and > or. 'and' binds tighter than 'or'." },

  // ---------- 3.8 ----------
  { sec: "3.8 Floating-point comparison", title: "Comparing floats",
    body: "Because floats are stored imprecisely, never test them with ==. Instead check whether they're \"close enough\": take the absolute value of their difference and compare it to a tiny threshold called an epsilon (0.0001 is common).",
    example: "// instead of  x == y :\nif AbsoluteValue(x - y) < 0.0001\n   Put \"equal enough\" to output",
    note: "EXAM TRAP: float == float is unreliable. Use AbsoluteValue(diff) < epsilon." },

  // ===== CHAPTER 4 — Loops =====
  {sec:"4.1 Loops (general)", title:"What a loop is", body:"A loop repeatedly executes its statements (the loop body) while the loop's expression is true. When the expression becomes false, execution jumps past the loop. Each pass through the body is called an iteration. A loop is like a branch that jumps back to re-check the expression.", example:"sum = 0\\nval = Get next input\\nwhile val > -1\\n   sum = sum + val\\n   val = Get next input\\nPut sum to output", note:"HOOK: 'loop body' = the statements repeated; 'iteration' = one lap."},
  {sec:"4.1 Loops (general)", title:"Examine a list one value at a time", body:"A common task is looping through input values, updating variables as you go: summing, averaging, counting negatives, or finding a max. You read a value, process it, and read the next until a stopping value appears.", example:"count = 0\\nval = Get next input\\nwhile val is not 0\\n   if val < 0\\n      count = count + 1\\n   val = Get next input", note:"TRAP: initialize your accumulator (sum=0, count=0) BEFORE the loop."},
  {sec:"4.2 Loop basics", title:"How a loop decides to run", body:"A loop starts with a decision statement holding the loop's expression. If true, the body runs, then execution returns to the decision. Once inside the body, it runs to the end even if the expression would become false partway through.", example:"while userNum == 1\\n   Put curPower to output\\n   curPower = curPower * 2\\n   userNum = Get next input", note:"The expression is re-checked only at the top, not mid-body."},
  {sec:"4.2 Loop basics", title:"Infinite loops and common errors", body:"An infinite loop never stops iterating. It usually happens by forgetting to update a variable in the body, or writing an expression that can never become false. Another common error is using the opposite expression, like x == 0 instead of x != 0. Remember: the expression says when to KEEP looping, not when to exit.", example:"numKids = 2\\nuserNum = Get next input\\nwhile userNum == 1\\n   Put numKids to output\\n   numKids = numKids * 2\\n   // forgot to Get next input -> infinite!", note:"EXAM TRAP: no update to the tested variable = infinite loop."},
  {sec:"4.3 More loop examples", title:"Sentinel values", body:"A sentinel value is a special value that marks the end of an input list, such as 0 ending 10 1 6 3 0, or a negative number. The loop processes values until the sentinel appears, and the sentinel itself is NOT included in the computation.", example:"currValue = Get next input\\nwhile currValue > 0\\n   valuesSum = valuesSum + currValue\\n   currValue = Get next input", note:"HOOK: sentinel = the 'stop' flag in the data, not real data."},
  {sec:"4.4 Looping N times", title:"The three parts of an N-times loop", body:"A loop that runs a specific number of times has three parts: (1) a loop variable initialization before the loop, (2) a decision statement with the loop expression, and (3) a loop variable update at the end of the body. To loop N times starting at 0, use i < N.", example:"i = 0\\nwhile i < 3\\n   // Loop's statements\\n   i = i + 1", note:"TRAP: i < 10 loops 10 times (i = 0 through 9), not 11."},
  {sec:"4.5 Loop examples iterating N times", title:"Beyond iterating N times", body:"By adjusting the three parts, an N-times loop can produce many sequences, like multiples of 5 or a temperature table. Change the start (init), the limit (expression), and the step (update) to control the output.", example:"for i = 10; i <= 50; i = i + 5\\n   Put i to output\\n   Put \" \" to output", note:"Init sets the start, update sets the step size."},
  {sec:"4.6 While and for loops", title:"Choosing while vs for", body:"Use a for loop when the number of iterations is computable before the loop (like loop N times or numItems times). Use a while loop when the count isn't easily known ahead of time (like loop until the input is 'q'). Both can compute the same things; the choice is about readability.", example:"// for: known count\\nfor i = 0; i < numItems; i = i + 1\\n// while: unknown count\\nwhile userNum != 0", note:"EXAM: know count -> for; unsure -> while."},
  {sec:"4.7 Nested loops", title:"Nested loops", body:"A nested loop is a loop inside another loop's body; they're called the inner and outer loops. The inner loop runs completely on every single iteration of the outer loop. Useful for grids and bar charts.", example:"for row = 1; row <= 4; row = row + 1\\n   for col = 5; col <= 7; col = col + 1\\n      Put row to output\\n      Put col to output", note:"Total inner runs = outer count x inner count.", opt:true},
  {sec:"4.8 Code: While loops", title:"Writing a while loop in Coral", body:"In code, a while loop uses the word 'while' followed by the expression. The body's statements are indented on the following lines. If the expression is true the body runs, then execution jumps back to re-check the condition.", example:"while userNum == 1\\n   Put curPower to output\\n   curPower = curPower * 2\\n   userNum = Get next input", note:"Indentation marks which statements are in the body."},
  {sec:"4.9 Do-while loop", title:"The do-while loop", body:"A do-while loop executes the body FIRST, then checks the condition. This means the body always runs at least once, unlike a while loop which may run zero times. Use it when at least one iteration must happen.", example:"do\\n   Put curCount to output\\n   userNum = userNum - 1\\n   curCount = curCount + 1\\nwhile userNum > 4", note:"EXAM: do-while = guaranteed at least one run."},
  {sec:"4.10 Code: For loops", title:"Writing a for loop in Coral", body:"A for loop puts three parts at the top separated by semicolons: initialization, expression, and update. No semicolon goes at the end. It describes iterating N times more naturally than a while loop. The update runs at the end of each body execution, before re-checking the expression.", example:"for i = 0; i < 3; i = i + 1\\n   Put sum to output\\n   sum = sum + 5", note:"TRAP: two semicolons inside the header, none after."},
  {sec:"4.11 Loops summary", title:"Picking the right control structure", body:"Output a fixed range (evens 2 to 50) -> for loop. Process input until a stop value (until 0) -> while loop. Run the body then decide to repeat -> do-while. Match the loop type to whether the count is known and whether one run is mandatory.", example:"// evens 2..50\\nfor i = 2; i <= 50; i = i + 2\\n   Put i to output", note:"if = decide once; loops = decide repeatedly."},

  // ===== CHAPTER 5 — Arrays =====
  {sec:"5.1 Array concept (general)", title:"Why arrays exist", body:"A normal variable holds only one data item. When a program needs a list of items (like 4 quarter scores), declaring separate variables is impractical. An array is one variable that stores an ordered list, with each item — called an element — directly accessible.", example:"pointsPerQuarter[3] is 28", note:"Truck (one item) vs train (many cars)."},
  {sec:"5.1 Array concept (general)", title:"Index and zero-based numbering", body:"Each element's position number is its index, written in brackets: myArray[2] has index 2. The index gives direct access to any element. In Coral, indices start at 0, so a 4-element array has indices 0, 1, 2, 3.", example:"myArray[2]   // the element at index 2", note:"EXAM TRAP: first element is index 0, not 1."},
  {sec:"5.2 Arrays", title:"Declaring and accessing", body:"An array is an ordered list of items of a given data type and size. Declare with the keyword 'array' and a size. Access element k as arrayName[k]. Coral arrays also store a size attribute holding the number of elements.", example:"integer array(3) itemCounts\nitemCounts[0] = 25\nitemCounts.size   // 3", note:"A single-item variable is a scalar; brackets [], braces {}, parentheses ()."},
  {sec:"5.2 Arrays", title:"Index as an expression", body:"A powerful feature is that an index can be an expression, such as userNums[i], which uses the value in variable i as the index. This lets a program look up the Nth item easily. The index must be an integer type — never a floating-point value.", example:"personAge = oldestPeople[nthPerson - 1]", note:"1st item is at index 0, so use nthPerson - 1."},
  {sec:"5.2 Arrays", title:"Last index = size - 1", body:"Because indices start at 0, an array of size N has its last element at index N-1. An array of size 3 has valid indices 0, 1, 2. If the last index is 499, the array has 500 elements.", example:"integer array(3) x   // valid: x[0], x[1], x[2]", note:"EXAM TRAP: size 100 -> last index 99."},
  {sec:"5.4 Iterating through arrays", title:"Standard loop form", body:"To iterate through an array, start i at 0 and loop while i < size, incrementing i each time. This produces i = 0, 1, ..., size-1, matching the array's valid indices. Using .size means only the declared size needs to change to handle larger arrays.", example:"for i = 0; i < userVals.size; i = i + 1\n   // use userVals[i]", note:"EXAM TRAP: condition is i < size, not i <= size."},
  {sec:"5.4 Iterating through arrays", title:"Summing elements", body:"To sum an array, initialize a variable sumVal to 0 before the loop, then add the current element to sumVal each iteration. Summing 5000 numbers needs no extra code — only the loop and array size change.", example:"sumVal = 0\nfor i = 0; i < userVals.size; i = i + 1\n   sumVal = sumVal + userVals[i]", note:"Init accumulator to 0."},
  {sec:"5.4 Iterating through arrays", title:"Finding the max", body:"To find the maximum, initialize maxVal by peeking at an element (maxVal = userVals[0]), then during the loop replace maxVal whenever a larger element is seen. Initializing maxVal to 0 is a logical error: for all-negative input it would wrongly output 0.", example:"maxVal = userVals[0]\nfor i = 0; i < userVals.size; i = i + 1\n   if userVals[i] > maxVal\n      maxVal = userVals[i]", note:"EXAM TRAP: seed max/min from an element, not 0."},
  {sec:"5.4 Iterating through arrays", title:"Out-of-range access", body:"A common error is accessing an index outside the array's valid range. If userVals has size 4, valid indices are 0..3, so userVals[4] is an error. In Coral, an out-of-range access generates an error message and the program immediately ends; in some languages it silently corrupts other memory.", example:"integer array(4) userVals\nuserVals[4] = 9   // ERROR, valid indices are 0..3", note:"EXAM TRAP: watch loop conditions and user-entered indices."},
  {sec:"5.5 Swapping two variables (general)", title:"Swap with a temp variable", body:"Swapping variables x and y means x takes y's value and y takes x's. The standard method uses a third temporary variable to hold one value while the other is copied over — like using a table to swap a book and phone between hands.", example:"tmpVal = x\nx = y\ny = tmpVal", note:"EXAM TRAP: x = y; y = x does NOT swap — x's old value is lost first."},
  {sec:"5.5 Swapping two variables (general)", title:"Swapping array elements / reversing", body:"Many swaps involve two array elements. Reversing a list of N elements swaps the outermost pair, then the next-inner pair, and so on, stopping at the middle. An N-element list needs about N/2 swaps.", example:"// reverse: swap [0]&[N-1], [1]&[N-2], ...", note:"Reversing 8 elements = 4 swaps."},
  {sec:"5.6 Code: Arrays", title:"Arrays in code with for loops", body:"In code, an array declaration adds the keyword 'array' with the size, e.g. integer array(4) userVals. Elements are userVals[0]..userVals[3], and the size is userVals.size. A for loop is the standard tool to read, sum, or scan every element.", example:"integer array(5) userVals\nfor i = 0; i < userVals.size; i = i + 1\n   userVals[i] = Get next input", note:"Declaration size and .size keep the loop general."},
  {sec:"5.7 Arrays summary", title:"Chapter key points", body:"An array variable stores multiple items, each accessible by an index, in contrast to a scalar variable that stores just one. Array indices start from 0, not 1, and an index may be an expression. The standard loop iterates i from 0 while i < size.", example:"integer array(4) userVals\n// userVals[0] .. userVals[3], userVals.size == 4", note:"Recap: array vs scalar, 0-based, .size, standard loop."},

  // ===== CHAPTER 6 — Functions =====
  {sec:"6.1 User-defined function basics", title:"What a function is", body:"A function is a named list of statements. A function definition consists of the function's name and a block of statements; the name can be any valid identifier. A function call invokes the name, causing those statements to execute. Execution begins with Main, jumps to the called function, then returns to the call location.", example:"Function PrintPizzaArea() returns nothing\\n   float PI_VAL\\n   PI_VAL = 3.14159265\\n   Put PI_VAL to output\\n\\nFunction Main() returns nothing\\n   PrintPizzaArea()", note:"EXAM TRAP: A defined-but-never-called function's statements never execute."},
  {sec:"6.1 User-defined function basics", title:"Parameters and arguments", body:"A parameter is a function input specified in the DEFINITION, like a variable declaration. An argument is the value provided to that parameter during the CALL. On a call, the parameter's memory is allocated and assigned the argument's value; on return it is deleted. An argument may be an expression such as 12.0, x, or x * 1.5.", example:"Function PrintPizzaArea(float pizzaDiameter) returns nothing\\n   ...\\n\\nFunction Main() returns nothing\\n   PrintPizzaArea(12.0)\\n   PrintPizzaArea(16.0)", note:"EXAM TRAP: parameter = definition side, argument = call side."},
  {sec:"6.1 User-defined function basics", title:"Multiple or no parameters", body:"A definition may have multiple parameters, matched to arguments BY POSITION (first-to-first, second-to-second). In Coral flowcharts, parameters are listed top to bottom. A function may also have no parameters, but the call must still include empty parentheses.", example:"CalcVal(99, 44 + 5)\\nPrintSomething()", note:"Valid args are values/expressions, NOT typed declarations like (integer 99, 44)."},
  {sec:"6.2 Return", title:"Returning a value", body:"A function may return one value by assigning a return variable with the return value. When the End statement is reached, the value held in the return variable is returned. A function can only return ONE item; a function that does not return a value declares no return variable.", example:"Function ComputeSquare(integer numToSquare) returns integer numSquared\\n   numSquared = numToSquare * numToSquare", note:"EXAM TRAP: a function cannot have two return variables."},
  {sec:"6.2 Return", title:"Calling functions in expressions", body:"A function call evaluates to the returned value, so a call often appears within an expression. A function that does NOT return a value cannot be used in an expression; it is used as a standalone statement instead.", example:"5 + ComputeSquare(4)   // evaluates to 5 + 16 = 21\\ny = SquareRoot(49.0)\\nOutputData(x, y)   // no return, used as a statement", note:"y = PrintVal(9.0) is invalid if PrintVal returns nothing."},
  {sec:"6.2 Return", title:"Functions calling functions", body:"A function's statements may call other functions. Main is always the first function called when a program executes, and it calls other functions. In the example, PizzaCalories calls CircleArea.", example:"Put PizzaCalories(pizzaDiameter) to output", note:"Readability comes from the sequence of function calls in Main."},
  {sec:"6.3 Reasons for defining functions", title:"Readability and modular/incremental development", body:"Decomposing a program into functions aids readability, keeping Main easy to read. Modular development divides a program into separately developed and tested modules. Incremental development writes and tests a little at a time. A function stub is a function definition whose statements are not yet written, used to plan behavior before details.", example:"Function ConvKilometersToMiles(float numKilometers) returns float numMiles\\n   Put \"FIXME: Convert km to m\\n\" to output", note:"Stubs let a program run before every function is finished."},
  {sec:"6.3 Reasons for defining functions", title:"Avoiding redundant statements", body:"A function can be defined once, then called from multiple places, avoiding redundant statements (e.g. a CircleArea function used twice). Good decomposition means each function has easily-recognizable behavior. A beginner guideline is a function definition of no more than about 20 statements.", example:"circleArea1 = CircleArea(pizzaDiameter1)\\ncircleArea2 = CircleArea(pizzaDiameter2)", note:"Benefit is NOT faster running or fewer executions — it's readability and less duplication.", opt:true},
  {sec:"6.4 Functions with branches/loops", title:"Functions with branches and loops", body:"A function's statements may include branches, loops, and other statements. The eBay fee calculator uses if/elseif/else inside EbayFee to compute a tiered fee. The LCM example shows FindLCM calling FindGCD — a user-defined function calling another.", example:"Function EbayFee(float sellPrice) returns float feeTotal\\n   feeTotal = 0.50\\n   if sellPrice <= 50.00\\n      feeTotal = feeTotal + (sellPrice * 0.13)", note:"EbayFee(0.0) returns 0.50 (base fee only)."},
  {sec:"6.5 Code: Functions", title:"Function definition syntax", body:"In Coral, a function definition begins with the word Function, the function's name, a comma-separated list of parameters in parentheses (required even if empty), and a return indication. Local variables and statements start on the next line, indented. If there's a return value the header names its type and variable; otherwise it says returns nothing.", example:"Function HeightFtInToCm(integer heightFt, integer heightIn) returns float heightCm\\n   float cmPerInch\\n   cmPerInch = 2.54", note:"'Function GetItems() returns integer item1, integer item2' is INVALID — only one return."},
  {sec:"6.5 Code: Functions", title:"Explicit return statement", body:"In many languages the return value is explicitly returned by a return statement, which returns the specified value and immediately exits the function.", example:"Function CircleArea(float circleDiameter) returns float circleArea\\n   float circleRadius\\n   float piVal\\n   piVal = 3.14159265\\n   circleRadius = circleDiameter / 2.0\\n   circleArea = piVal * circleRadius * circleRadius\\n   return circleArea", note:"return exits the function immediately."},
  {sec:"6.6 Code: Functions with array parameters", title:"Array parameters and arguments", body:"A function's parameter may be an array, written with the word array and unknown size (?). The size ? means it depends on the argument. To call, the argument passes only the array's name. Statements typically use array.size and array[i].", example:"Function SomeFct(integer array(?) numList) returns nothing\\n   ... numList.size ...\\n   ... numList[i] ...\\n\\nFunction Main() returns nothing\\n   integer array(10) userNums\\n   SomeFct(userNums)", note:"numList.size evaluates to the passed array's size (e.g. 10), so the function works for any size.", opt:true},

  // ===== CHAPTER 7 — Algorithms =====
  {sec:"7.1 Algorithms", title:"What an algorithm is", body:"An algorithm is a sequence of steps that solves a problem, generating correct output for ANY valid input. Before writing a program, a programmer must first create a correct algorithm. Ensuring correctness is a key job for the programmer.", example:"Compute average of 5 values:\nsum = 0\nFor each value\n  sum = sum + value\nAverage = sum / 5", note:"An algorithm producing the right answer for ONE test input is NOT proven correct."},
  {sec:"7.1 Algorithms", title:"Time efficiency intro", body:"Algorithms differ in time efficiency: the number of calculations needed to solve a problem. Simple algorithms are more likely correct, and correctness is always most important. Consider efficiency only when needed, e.g. very large data sets that run slowly.", example:"Linear search and binary search are BOTH correct, but binary search is more time efficient.", note:"Correctness beats speed; optimize only for large data."},
  {sec:"7.1 Algorithms", title:"Linear vs binary, first look", body:"To find a value in an ascending list, linear search checks each item in order from the first. Binary search instead checks the range's middle: if the key is greater, search the upper half; if less, the lower half, until found or no range remains.", example:"Find 1983 in 9 sorted war dates:\nLinear = 6 checks\nBinary = 3 checks (1961 → 1989 → 1983)", note:"For 500 items, linear averages ~250 comparisons but binary always uses fewer than 10."},
  {sec:"7.2 Introduction to algorithms", title:"Computational problems", body:"An algorithm describes steps to solve a computational problem. A computational problem specifies an input, a question about the input answerable by a computer, and the desired output. An algorithm can be written in English, pseudocode, or any language.", example:"Input: [13,7,45,-3,92,17]\nQuestion: max value?\nOutput: 92 (via FindMax)", note:"An algorithm does NOT have to be written in a programming language."},
  {sec:"7.2 Introduction to algorithms", title:"Common algorithms & hard problems", body:"Many problems share common subproblems with efficient known algorithms (binary search for lookups, longest common substring for DNA, Dijkstra's shortest path for navigation). An efficient algorithm's runtime grows no more than polynomially with input size. NP-complete problems have no known efficient algorithm.", example:"Binary search: efficient search of a SORTED, directly accessible list (array).", note:"For NP-complete problems, aim for a good non-optimal solution instead of the perfect one.", opt:true},
  {sec:"7.3 Algorithm efficiency", title:"Computational complexity", body:"Algorithm efficiency is measured by computational complexity: the resources an algorithm uses, most commonly runtime and memory usage. Complexity analysis lets you compare different algorithms and avoid ones with long runtimes or high memory.", example:"4 algorithms compared on runtime bars vs memory bars — the fastest may use the most memory.", note:"Two algorithms with the same result can have very different complexity."},
  {sec:"7.3 Algorithm efficiency", title:"Best case and worst case", body:"Runtime can vary a lot with the input, so we identify best and worst cases. Best case = minimum possible operations; worst case = maximum possible operations. These describe the input's CONTENTS only — the input size N must stay a variable.", example:"LinearSearch [54,79,26,91,29,33]:\nkey=54 → best case (1 compare)\nkey=82 → worst case (all compared, not found)", note:"EXAM TRAP: N must remain variable, else every best case would just be N=0."},
  {sec:"7.4 Searching and algorithms", title:"Linear search algorithm", body:"Linear search starts at the beginning of a list and checks each element one by one until the search key is found or the end of the list is reached. It works on sorted OR unsorted lists.", example:"Function LinearSearch(numbers, key)\n  keyIndex = -1\n  for i=0; (i<numbers.size) and (keyIndex==-1); i=i+1\n    if numbers[i] == key\n      keyIndex = i", note:"If the key isn't present, linear search compares EVERY element."},
  {sec:"7.4 Searching and algorithms", title:"Linear search runtime", body:"An algorithm typically uses steps proportional to the input size. For N elements, linear search requires at most N comparisons and is said to be 'on the order of' N. At 1 microsecond per comparison, searching 1,000,000 elements takes up to 1 second.", example:"32-element list: 1 comparison if found at index 0, up to 32 if not found.", note:"Amazon's 200M+ items via linear search could take more than 3 minutes."},
  {sec:"7.5 Binary search", title:"Linear vs binary search", body:"Linear search may scan all elements, causing long runtimes. Because a list can be sorted, binary search checks the middle element first, then searches only the first half (if the key comes before) or the last half. Each step halves the elements still to search.", example:"Phone contacts sorted A-Z: to find Pooja, check the middle (Muhammad), then only the half after it, halving again each step.", note:"Binary search only works because the contact list is SORTED."},
  {sec:"7.5 Binary search", title:"Binary search algorithm", body:"Binary search requires elements sorted and directly accessible (array). It checks the middle; if found, returns the location; otherwise repeats on the left sublist (key < middle) or right sublist (key > middle). mid = (high + low) / 2, rounding down.", example:"Function BinarySearch(numbers, key)\n  high = numbers.size - 1\n  while (high >= low) and (numbers[mid] != key)\n    mid = (high + low) / 2\n    if numbers[mid] < key\n      low = mid + 1\n    elseif numbers[mid] > key\n      high = mid - 1\n  if numbers[mid] != key\n    mid = -1", note:"EXAM TRAP: elements MUST be sorted or binary search fails."},
  {sec:"7.5 Binary search", title:"Binary search trace (key 16)", body:"On [2,5,6,14,16,24,32,63] searching 16: low=0, high=7. mid=(0+7)/2=3 → 14, 16>14 so low=4. mid=(4+7)/2=5 → 24, 16<24 so high=4. mid=(4+4)/2=4 → 16, found at index 4.", example:"Step order: check 14 (idx3) → check 24 (idx5) → check 16 (idx4) = 3 comparisons.", note:"Integer division rounds DOWN when choosing mid."},
  {sec:"7.5 Binary search", title:"Binary search efficiency", body:"Binary search reduces the search space by half each step, terminating when the key is found or the space is empty. For an N-element list, the max steps to empty the sublist is floor(log2 N) + 1.", example:"32 → 16 → 8 → 4 → 2 → 1 → none = 6 steps.\nfloor(log2 32) + 1 = 6.", note:"At 1 microsecond/compare, 200M items takes under 28 microseconds — up to 7,000,000x faster than linear."},
  {sec:"7.6 Sorting: Introduction", title:"Sorting basics", body:"Sorting converts a list into ascending (or descending) order. A program can't see the whole list, so it's limited to simple steps — typically observing or swapping just two elements at a time. Swapping values is a key part of sorting algorithms.", example:"(17, 3, 44, 6, 9) sorted ascending → (3, 6, 9, 17, 44)", note:"Ascending = smallest to largest; descending = largest to smallest.", opt:true},
  {sec:"7.7 Heuristics", title:"Heuristics", body:"Solving a problem optimally can require more resources than are feasible. A heuristic willingly accepts a non-optimal or less accurate solution to improve speed. A heuristic algorithm quickly finds a near-optimal or approximate solution.", example:"0-1 knapsack (each item at most once): greedily take the most valuable item that still fits — simple but may give a non-optimal result.", note:"A heuristic sacrifices optimality/accuracy for SPEED — it does not guarantee the best answer.", opt:true},
  {sec:"7.8 Algorithms summary", title:"Chapter recap", body:"A programmer must first create a correct algorithm: a sequence of steps to solve a problem. For large data, an algorithm's time efficiency — the number of calculations needed — also becomes relevant. Linear and binary search are both correct, but binary is far more efficient on large sorted lists.", example:"Correctness first → then efficiency for big data.\nLinear = O(N), Binary = O(log N) on sorted data.", note:"A correct algorithm can be slower yet still correct; a faster algorithm is not automatically correct."},

  // ===== CHAPTER 8 — SDLC & UML =====
  {sec:"8.1 Software design processes", title:"The four SDLC phases", body:"A program is built through the systems development life cycle (SDLC), a set of phases. Analysis defines a program's goals. Design defines the specifics of how to build it. Implementation involves writing the program, and testing checks that the program correctly meets the goals.", example:"Analysis  -> define goals\\nDesign    -> how to build\\nImplement -> write the code\\nTesting   -> meets the goals?", note:"EXAM TRAP: code is written in Implementation, not Design."},
  {sec:"8.1 Software design processes", title:"Waterfall vs agile (spiral)", body:"The waterfall approach carries out the SDLC phases in sequence one time; because no earlier phase is returned to, it is named after a boat going down a river that never comes back. The agile (or spiral) approach does small amounts of each phase in sequence and then repeats, adding more to the program each cycle.", example:"Waterfall: A -> D -> I -> T   (once)\\nAgile:     A->D->I->T, A->D->I->T, ...", note:"Agile is more responsive to user feedback; a single phase tends to take longer under waterfall."},
  {sec:"8.1 Software design processes", title:"SDLC case study: loans program", body:"A programmer who used waterfall talked to 30 customers, supported many loan types, implemented, and tested over ~2 months. After release, users wanted graphical comparisons and rarely used most loan types. Building fewer loans first and iterating (agile) would have surfaced the graphical need sooner.", example:"Waterfall pitfall: 2 months invested,\\nprogram not popular, changes too costly.\\nAgile fix: build small, learn, extend.", note:"House analogy: building a few rooms at a time lets people move in sooner."},
  {sec:"8.2 Objects: Introduction", title:"Grouping things into objects", body:"Just as people think in higher-level objects (chairs, drawers) rather than raw materials, programmers group variables and functions into objects. In programming, an object is a grouping of data (variables) and operations on that data (functions).", example:"Drawer object\\n  data: wood, metal bar\\n  ops:  put stuff in, take stuff out", note:"Off-blueprint for Ch8 study questions but foundational OO context.", opt:true},
  {sec:"8.2 Objects: Introduction", title:"Abstraction / information hiding", body:"Abstraction means a user interacts with an item at a high level while lower-level internal details are hidden, also called information hiding or encapsulation. Objects strongly support abstraction by hiding groups of variables and functions and exposing only certain operations.", example:"Oven: use compartment + knob\\nHidden: the flame/internal parts", note:"An abstract data type (ADT) constrains creation/update to well-defined operations; a class can implement an ADT.", opt:true},
  {sec:"8.3 UML", title:"What UML is", body:"The Unified Modeling Language (UML) is a modeling language for software design that uses different diagram types to visualize the structure and behavior of programs. It consists of several structural and behavioral diagrams.", example:"UML = pictures of software design", note:"UML models software; it is not program code."},
  {sec:"8.3 UML", title:"Structural vs behavioral diagrams", body:"A structural diagram visualizes static elements of software, such as the types of variables and functions used. A behavioral diagram visualizes dynamic behavior, such as the flow of an algorithm. A UML activity diagram is a flowchart used to describe the flow of an activity or set of activities.", example:"Structural = static (variables, functions)\\nBehavioral = dynamic (flow, interactions)", note:"EXAM TRAP: Activity, use case, and sequence are behavioral; class is structural."},
  {sec:"8.3 UML", title:"Use case diagram", body:"A UML use case diagram is a behavioral diagram used to visually model how a user interacts with a software program. It illustrates user actions and accompanying software actions, plus connections between different software components. Use case diagrams are often used to specify behavioral requirements.", example:"Shopper -> Browse products -> Inventory database\\n        -> Buy items -> Bank/payment service", note:"A use case diagram contains no code and does not always indicate order of events."},
  {sec:"8.3 UML", title:"Class diagram", body:"A UML class diagram is a structural diagram used to visually model the classes of a program, including data members and functions. A class is a code blueprint for creating an object composed of data members and functions that operate on those members.", example:"Car\\n + make : string\\n + model : string\\nCarForSale (inherits Car)\\n + salePrice : float\\n - daysOnLot : integer", note:"Class diagrams can show data types, inheritance (hollow triangle), and has-a relationships (unfilled diamond); they do NOT show high-level business use cases."},
  {sec:"8.3 UML", title:"Sequence diagram", body:"A UML sequence diagram is a behavioral diagram that shows interaction between software components and indicates the order of events. It is commonly used to illustrate the sequence of events needed to handle a particular scenario.", example:"Computer --send search term--> Server\\nServer  --send first 50 results--> Computer\\nComputer--request next 50-------> Server", note:"Vertical dashed lines = lifelines; horizontal dashed lines = responses. Contains no code."},
  {sec:"8.3 UML", title:"UML and the SDLC phases", body:"UML diagrams map onto SDLC phases regardless of waterfall or agile. Analysis uses a use case diagram (what goals to carry out); design uses a class diagram (group data and functions); implementation uses an activity diagram (instructions, branches, loops); testing uses a sequence diagram (outputs generated in expected order).", example:"Analysis      -> Use case diagram\\nDesign        -> Class diagram\\nImplementation-> Activity diagram\\nTesting       -> Sequence diagram", note:"EXAM TRAP: Memorize this 4-to-4 mapping exactly."},
  {sec:"8.6 UML summary", title:"UML key points", body:"UML uses different kinds of diagrams to visualize programs: a structural diagram shows static items like variables and functions, and a behavioral diagram shows dynamic behavior like flow. A use case diagram is behavioral, a class diagram is structural, and a sequence diagram is behavioral.", example:"use case = behavioral\\nclass    = structural\\nsequence = behavioral", note:"Class is the odd one out: it's structural."},
  {sec:"8.7 Software design processes summary", title:"SDLC key points", body:"Programs may be developed in phases known as the SDLC, wherein analysis defines a program's goals, design defines specifics of how to build a program, implementation writes the program, and testing checks the program. A waterfall approach does the phases in sequence once, while an agile (spiral) approach does smaller amounts of each phase and repeats.", example:"Waterfall: sequence, once\\nAgile: smaller pieces, repeats", note:"Analysis emphasizes defining goals; agile has no max on how many times implementation runs."},

  // ===== CHAPTER 9 — Languages =====
  {sec:"9.1 Language survey", title:"Compiled vs. interpreted", body:"A compiled language is first converted by a compiler into machine code that runs on a particular machine. An interpreted (aka scripting) language is run one statement at a time by an interpreter. Interpreted programs run on any machine that has an interpreter and are easier for new programmers, but compiled languages run faster.", example:"Compiled: C, C++, Java, C#\\nInterpreted: Python, JavaScript, MATLAB", note:"EXAM TRAP: Compiled = faster; Interpreted = more portable."},
  {sec:"9.1 Language survey", title:"How compiling works", body:"A programmer writes high-level source code (myfile.prog). A compiler converts it into a low-level binary executable (myfile.exe). Users then run the executable.", example:"myfile.prog -> Compiler -> myfile.exe -> run", note:"Two steps: compile, then run."},
  {sec:"9.1 Language survey", title:"How interpreting works", body:"With an interpreted language the programmer still writes high-level source, but a user runs an interpreter to execute that program directly. No separate executable is produced first.", example:"> interpreter myfile.prog", note:"One step: interpreter runs the source."},
  {sec:"9.1 Language survey", title:"Statically vs. dynamically typed", body:"In a statically typed language each variable's type must be declared and cannot change while the program runs ('static' = unchanging). In a dynamically typed language a variable's type may change during execution based on what is assigned ('dynamic' = changing).", example:"Static: C, C++, Java\\nDynamic: Python", note:"EXAM TRAP: static type is fixed; dynamic type follows the value."},
  {sec:"9.1 Language survey", title:"Static example (C++)", body:"An int x assigned x * 1.5 should be 7.5 (a float), but because x is an integer a conversion occurs: the fraction is ignored and x gets 7. Assigning a string to an int fails to compile.", example:"int x;\\nx = 5;\\nx = x * 1.5;  // x becomes 7", note:"Static catches type errors at compile time."},
  {sec:"9.1 Language survey", title:"Dynamic example (Python)", body:"x is first assigned a string, making x a string type. Assigning x = 5 changes x to an integer. Assigning x = x * 1.5 makes the result a float, so x's type becomes a float.", example:"x = \"Hello\"  # string\\nx = 5        # integer\\nx = x * 1.5  # float", note:"Same variable, three different types."},
  {sec:"9.1 Language survey", title:"Static safer, dynamic easier", body:"Statically typed languages are often considered safer because they report errors during compilation (like assigning an integer with a string). Dynamically typed languages are considered easier when types need to change. Much debate exists — neither is simply 'better'.", example:"Static: reports error at compile time\\nDynamic: no error, type just changes", note:"'Dynamic is better than static' = False."},
  {sec:"9.1 Language survey", title:"Object-oriented languages", body:"An object consists of internal data items plus operations that can be performed on that data. An object-oriented language supports decomposing a program into objects, making a large program more understandable and manageable.", example:"RunnerInfo: distRun, timeRun,\\n  GetSpeed(), PrintRunnerStats()", note:"Object = data + operations bundled together."},
  {sec:"9.1 Language survey", title:"Which languages support objects", body:"C++, Java, Python, and C# provide extensive object-oriented support. MATLAB and JavaScript provide some support. C does NOT support objects — the '++' in C++ suggests it improves on C largely by adding objects.", example:"Extensive: C++, Java, Python, C#\\nSome: MATLAB, JavaScript\\nNone: C", note:"EXAM TRAP: C is NOT object-oriented."},
  {sec:"9.1 Language survey", title:"Markup languages", body:"A markup language lets a developer describe a document's content, formatting, or other features. HTML (Hyper-Text Markup Language) describes text, links, and images of a web page. It is NOT executed statement-by-statement — an HTML file is not a program; a browser reads it and renders the page.", example:"<h1>Is Pluto a Planet?</h1>\\n<p>text <i>italic</i></p>", note:"EXAM TRAP: HTML is rendered, not compiled or run."},
  {sec:"9.1 Language survey", title:"HTML tags", body:"An HTML file surrounds text with different tags to yield different formatting. For example h1 makes large bold text and <u>...</u> underlines text. A browser renders these — it does not execute them one statement at a time.", example:"<h1>big bold</h1>\\n<u>underlined</u>", note:"Tags format; they do not compute logic."},
  {sec:"9.2 Libraries", title:"Library basics", body:"A library is a set of pre-written functions (and other items) that carry out common tasks, used to improve productivity. After including a library, a programmer can call its functions. A library's functions typically all relate to the same purpose, and a program may include several libraries.", example:"Include StatisticsLibrary\\nmean = ComputeMean(userList)\\nmax = ComputeMax(userList)", note:"Include, then call — you don't write the functions."},
  {sec:"9.2 Libraries", title:"Why libraries matter", body:"A key advantage of using a library is improved programmer productivity: you reuse pre-written functions instead of writing them yourself. Libraries hold many functions (not just one), and a single program can use more than one library.", example:"StatisticsLibrary: ComputeMean,\\n  ComputeMedian, ComputeMax", note:"Productivity via reuse."},
  {sec:"9.3 Software languages and libraries summary", title:"Chapter wrap-up", body:"Many kinds of languages exist, each with advantages and purposes. Compiled languages convert to machine code; interpreted run on an interpreter. Static languages fix a variable's type; dynamic let it change. Object-oriented languages decompose programs into objects. Markup languages (HTML) describe formatting rather than execute. Programmers use libraries of pre-written functions to improve productivity.", example:"Compiled: C, C++, Java, C#\\nInterpreted: Python, JS, MATLAB\\nMarkup: HTML", note:"The categories are NOT mutually exclusive."},
];

    options: ["Returns 0", "Runtime error — the program terminates", "Returns Infinity"], answer: 1,
    why: "A zero divisor crashes the program." },
  // 2.7
  { ch:2, q: "What is 12.0 / 0.0 in Coral?",
    options: ["Error / crash", "Infinity", "0"], answer: 1,
    why: "A float ÷ 0 gives Infinity (or -Infinity), NOT a crash." },
  // 2.12
  { ch:2, q: "What does 23 % 10 evaluate to?",
    options: ["2", "3", "13"], answer: 1,
    why: "Modulo returns the remainder: 23 = 2×10 + 3." },
  { ch:2, q: "Which expression is INVALID?",
    options: ["23 % 10", "10 % 4.0", "137 % 60"], answer: 1,
    why: "Modulo needs integer operands; 4.0 is a float." },
  // 2.11
  { ch:2, q: "How do you cast integer n to a float?",
    options: ["Multiply by 1.0 (n * 1.0)", "Divide by 1", "Add 0"], answer: 0,
    why: "Multiplying by 1.0 forces floating-point math." },
  { ch:2, q: "Converting the float 4.9 to an integer gives:",
    options: ["5", "4", "0"], answer: 1,
    why: "The fraction is dropped — not rounded." },
  // 2.9
  { ch:2, q: "How many values can RandomNumber(0, 25) return?",
    options: ["25", "26", "24"], answer: 1,
    why: "high − low + 1 = 25 − 0 + 1 = 26 (both ends included)." },
  // 2.13 / 2.14
  { ch:2, q: "A value that is only true or false is a:",
    options: ["character", "Boolean", "string"], answer: 1,
    why: "A Boolean has exactly two possible values." },
  { ch:2, q: "A named value that CANNOT change is a:",
    options: ["variable", "constant", "literal"], answer: 1,
    why: "A constant is fixed; convention names it UPPER_CASE." },

  // ===== CHAPTER 3 =====
  // 3.1
  { ch:3, q: "In an if-else branch, how many of the two branches run?",
    options: ["Both", "Exactly one", "None or one"], answer: 1,
    why: "If the condition is true the if block runs, otherwise the else — exactly one." },
  { ch:3, q: "In an if-elseif-else chain, which branch runs?",
    options: ["Every true one", "Only the first true one", "Only the else"], answer: 1,
    why: "The first condition that is true runs; the rest are skipped." },
  // 3.2
  { ch:3, q: "Three SEPARATE if statements in a row — how many can run?",
    options: ["Exactly one", "More than one", "None"], answer: 1,
    why: "Each if is independent, so several branches may run." },
  // 3.3
  { ch:3, q: "Which is the equality operator?",
    options: ["=", "==", "!="], answer: 1,
    why: "== tests equality; = is assignment; != tests 'not equal'." },
  { ch:3, q: "Should you compare two floats with == ?",
    options: ["Yes, always", "No — floats are imprecise", "Only if positive"], answer: 1,
    why: "Float representation is inexact; use a close-enough check instead." },
  { ch:3, q: "Which lists the four relational operators?",
    options: ["< > <= >=", "= == != <>", "< > =< =>"], answer: 0,
    why: "less, greater, less-or-equal, greater-or-equal. =< and => are invalid." },
  // 3.5
  { ch:3, q: "(a) and (b) is true when:",
    options: ["at least one is true", "both are true", "neither is true"], answer: 1,
    why: "'and' requires BOTH operands to be true." },
  { ch:3, q: "(a) or (b) is true when:",
    options: ["both are true", "at least one is true", "both are false"], answer: 1,
    why: "'or' is true when at least one operand is true." },
  { ch:3, q: "How do you write 'x is between 0 and 10' in Coral?",
    options: ["0 < x < 10", "(0 < x) and (x < 10)", "x > 0 or x < 10"], answer: 1,
    why: "You can't chain comparisons; join two with and." },
  // 3.6
  { ch:3, q: "Among logical operators, which has the HIGHEST precedence?",
    options: ["or", "and", "not"], answer: 2,
    why: "Order is not → and → or; not is highest, or is lowest." },
  { ch:3, q: "x == 5 or y == 10 and z != 10 is grouped as:",
    options: ["((x==5) or (y==10)) and (z!=10)", "(x==5) or ((y==10) and (z!=10))", "left to right"], answer: 1,
    why: "'and' binds tighter than 'or'." },
  // 3.8
  { ch:3, q: "The tiny threshold used to compare floats 'close enough' is called:",
    options: ["a delta", "an epsilon", "a margin"], answer: 1,
    why: "AbsoluteValue(x - y) < epsilon (often 0.0001)." },

  // ===== CHAPTER 4 =====
  { ch:4,q:"How is an infinite loop most commonly created by accident?", options:["Forgetting to update the variable tested in the loop expression","Initializing the loop variable to 0","Using a for loop instead of a while loop"], answer:0, why:"If the tested variable never changes, the expression stays true forever."},
  { ch:4,q:"What is a sentinel value?", options:["The average of a list","A special value marking the end of an input list","The number of iterations a loop runs"], answer:1, why:"e.g. 0 ends the list 10 1 6 3 0, and is not part of the computation."},
  { ch:4,q:"What are the three parts of a loop that iterates N times?", options:["Start, middle, end","Init, expression, and update of the loop variable","Input, process, output"], answer:1, why:"Initialization before, expression to decide, update at the body's end."},
  { ch:4,q:"What is the key difference between a while loop and a do-while loop?", options:["do-while checks the condition after the body, so it runs at least once","while can only use == in its expression","do-while cannot use input"], answer:0, why:"while checks first (may run 0 times); do-while checks after (runs >= 1 time)."},
  { ch:4,q:"Which control structure is guaranteed to execute its body at least one time?", options:["while loop","for loop","do-while loop"], answer:2, why:"The do-while condition is evaluated only after the body runs."},
  { ch:4,q:"Which loop is best when you don't know how many iterations you need?", options:["for loop","while loop","No loop can do that"], answer:1, why:"while suits an unknown count, e.g. iterate until input is 0."},
  { ch:4,q:"Which loop is best when you know exactly how many times to iterate?", options:["for loop","do-while loop","while loop only"], answer:0, why:"A for loop naturally describes iterating a set number of times."},
  { ch:4,q:"For 'for i = 0; i < 3; i = i + 1', what values does i take inside the body?", options:["0, 1, 2, 3","0, 1, 2","1, 2, 3"], answer:1, why:"When i reaches 3, i < 3 is false so the body doesn't run."},
  { ch:4,q:"To make a loop iterate exactly 10 times starting at i = 0, the expression is:", options:["i < 9","i < 10","i <= 10"], answer:1, why:"i takes 0 through 9, which is 10 iterations."},
  { ch:4,q:"How many times does the loop variable initialization (i = 0) execute?", options:["Once","Once per iteration","Zero times"], answer:0, why:"Initialization runs a single time before the loop begins."},
  { ch:4,q:"A common error is to write the loop expression as the opposite of what's intended, because:", options:["The expression describes when the loop should iterate, not when it should exit","Coral requires == in all loops","Loops always run backward"], answer:0, why:"e.g. use x != 0 (keep looping) not x == 0."},
  { ch:4,q:"Output pseudocode: x=10; while x>4 { Put x; Put \" \"; x=x-2 }", options:["10 9 8 7 6 5","10 8 6","10 8 6 4"], answer:1, why:"Prints 10, 8, 6; then 4 > 4 is false and it stops."},
  { ch:4,q:"In a for loop header, semicolons separate:", options:["Each output statement","The initialization, expression, and update","Nested loops"], answer:1, why:"for init; expression; update — no semicolon at the end."},
  { ch:4,q:"In a nested loop, how many total times does the inner body run for a 4x3 nesting?", options:["7","12","4"], answer:1, why:"Inner runs fully (3) on each of the 4 outer iterations: 4 x 3 = 12."},
  { ch:4,q:"A program outputs even numbers from 2 to 50. Best control structure?", options:["if statement","for loop","do-while loop"], answer:1, why:"The count is known/computable, so a for loop fits."},
  { ch:4,q:"Get input, convert, and repeat until the input is zero. Best control structure?", options:["while loop","for loop","if statement"], answer:0, why:"Unknown iteration count ending on a sentinel suits a while loop."},
  { ch:4,q:"Which statement about for and while loops is true?", options:["All for loops can be rewritten as equivalent while loops","for loops cannot use input","while loops always run at least once"], answer:0, why:"A for loop is just a compact form of a common while pattern."},
  { ch:4,q:"When finding a max by looping, each value after the first is compared using:", options:["maxSoFar > currValue","currValue > maxSoFar","currValue == maxSoFar"], answer:1, why:"If the current value is greater, it replaces the max-so-far."},

  // ===== CHAPTER 5 =====
  { ch:5,q:"In Coral, what is the index of the first element of an array?", options:["1","0","-1"], answer:1, why:"Coral arrays are zero-based; the first element is index 0."},
  { ch:5,q:"An array is declared with size 3. What is the index of the last element?", options:["3","4","2"], answer:2, why:"Last index = size - 1 = 2."},
  { ch:5,q:"If an array's last index is 499, how many elements does it have?", options:["499","500","501"], answer:1, why:"Elements = last index + 1 = 500."},
  { ch:5,q:"Which correctly declares an integer array named numList with 5 elements?", options:["integer numList array(5)","integer array(5) numList","array integer numList[5]"], answer:1, why:"Coral syntax: integer array(5) numList."},
  { ch:5,q:"Which assigns the value 250 to element 0 of peoplePerDay?", options:["peoplePerDay[250] = 0","peoplePerDay = 250","peoplePerDay[0] = 250"], answer:2, why:"Index goes in brackets, value on the right."},
  { ch:5,q:"Which accesses the first element of itemCounts?", options:["itemCounts[1]","itemCounts[0]","itemCounts.first"], answer:1, why:"First element is at index 0."},
  { ch:5,q:"How is an array's number of elements accessed in Coral?", options:["userVals.length","userVals.count","userVals.size"], answer:2, why:"Coral uses the .size attribute."},
  { ch:5,q:"Which is the correct standard loop to iterate an array userVals?", options:["for i = 1; i <= userVals.size; i = i + 1","for i = 0; i < userVals.size; i = i + 1","for i = 0; i <= userVals.size; i = i + 1"], answer:1, why:"Start at 0, loop while i < size."},
  { ch:5,q:"userVals has size 4. Which access is out of range?", options:["userVals[0]","userVals[3]","userVals[4]"], answer:2, why:"Valid indices are 0..3; index 4 is out of range."},
  { ch:5,q:"What happens in Coral when an out-of-range index is accessed?", options:["It returns 0","An error is generated and the program ends","It wraps around to index 0"], answer:1, why:"Coral generates an error and immediately ends the program."},
  { ch:5,q:"An array index must be what type?", options:["Any numeric type including floats","An integer type","A string"], answer:1, why:"The index must be an integer; floating-point (even 1.0) is not allowed."},
  { ch:5,q:"To find the max, how should maxVal be initialized?", options:["maxVal = 0","maxVal = userVals[0]","maxVal = -1"], answer:1, why:"Seed from an actual element so all-negative input works."},
  { ch:5,q:"Why is initializing maxVal to 0 a logical error?", options:["0 can't be stored in an integer","For all-negative input the max would wrongly be 0","The loop wouldn't run"], answer:1, why:"0 isn't really the largest value seen so far."},
  { ch:5,q:"Which statements correctly swap x and y?", options:["x = y; y = x","tmpVal = x; x = y; y = tmpVal","x = y; y = tmpVal"], answer:1, why:"A temporary variable preserves x's original value."},
  { ch:5,q:"After x = y then y = x (x=22, y=99 initially), the result is:", options:["x is 99 and y is 22","x is 99 and y is 99","x is 22 and y is 99"], answer:1, why:"x's old value is lost, so both become 99."},
  { ch:5,q:"For the Nth oldest person, which index accesses the Nth person?", options:["oldestPeople[nthPerson]","oldestPeople[nthPerson - 1]","oldestPeople[nthPerson + 1]"], answer:1, why:"Indices start at 0, so the Nth item is at index N-1."},
  { ch:5,q:"How many swaps reverse a list of 8 elements?", options:["8","7","4"], answer:2, why:"Swap pairs from the ends inward: N/2 = 4 swaps."},
  { ch:5,q:"Which is the best variable type for a list of every month's weight?", options:["scalar","array","neither"], answer:1, why:"A list of many values is best held in an array."},

  // ===== CHAPTER 6 =====
  { ch:6,q:"A function is best described as:", options:["A single variable","A named list of statements","A type of loop"], answer:1, why:"Core definition"},
  { ch:6,q:"A function call causes:", options:["The function's statements to execute","The program to end","A new variable type"], answer:0, why:"Call runs the statements"},
  { ch:6,q:"A program's execution begins with which function?", options:["The first defined function","Main","Any function"], answer:1, why:"Main runs first"},
  { ch:6,q:"If you define a function but never call it, its statements:", options:["Run once automatically","Never execute","Run at program end"], answer:1, why:"Defined ≠ run"},
  { ch:6,q:"A parameter is specified in the:", options:["Function call","Function definition","Main only"], answer:1, why:"Parameter = definition side"},
  { ch:6,q:"An argument is:", options:["A value passed to a parameter during a call","The function's name","A local variable"], answer:0, why:"Argument = call side"},
  { ch:6,q:"For CalcVal(42, 55, 77), the second parameter b is assigned:", options:["42","55","77"], answer:1, why:"Matched by position"},
  { ch:6,q:"How do you call a function that has no parameters?", options:["Just its name","Its name with empty parentheses","You can't call it"], answer:1, why:"Parens still required"},
  { ch:6,q:"How many values can a Coral function return?", options:["One","Two","Any number"], answer:0, why:"Single return only"},
  { ch:6,q:"A function call evaluates to:", options:["Its returned value","Its name","Nothing ever"], answer:0, why:"Can be used in expressions"},
  { ch:6,q:"A function that returns nothing:", options:["Can be used in an expression","Cannot be used in an expression","Must return a number"], answer:1, why:"void can't be in expression"},
  { ch:6,q:"A return statement:", options:["Returns a value and immediately exits the function","Prints a value","Declares a variable"], answer:0, why:"return exits immediately"},
  { ch:6,q:"What does ComputeSquare(9) return?", options:["3","9","81"], answer:2, why:"9*9=81"},
  { ch:6,q:"A function stub is:", options:["A function whose statements aren't yet written","A function that runs faster","A function with no name"], answer:0, why:"Placeholder for planning"},
  { ch:6,q:"A key benefit of functions is to:", options:["Make Main run faster","Improve readability and avoid redundant code","Increase redundant statements"], answer:1, why:"Readability + DRY, not speed"},
  { ch:6,q:"Modular development means:", options:["Dividing a program into separately developed/tested modules","Writing all code in Main","Never testing until done"], answer:0, why:"Definition"},
  { ch:6,q:"To pass an array userNums as an argument, you write:", options:["SomeFct(userNums(10))","SomeFct(userNums)","SomeFct(integer userNums)"], answer:1, why:"Pass array name only"},
  { ch:6,q:"Is 'Function MyFct(integer userNum + 5) returns nothing' a valid definition?", options:["Yes","No — a parameter is a declaration, not an expression","Only in Main"], answer:1, why:"Def side can't compute"},

  // ===== CHAPTER 7 =====
  { ch:7,q:"An algorithm is best defined as:", options:["A program written in a specific language","A sequence of steps that solves a problem for any valid input","A single test case that produces correct output"], answer:1, why:"Algorithms must be correct for ALL valid inputs."},
  { ch:7,q:"If an algorithm gives the correct output for one test input, it is:", options:["Proven correct","Not necessarily correct","Guaranteed efficient"], answer:1, why:"One passing test does not prove correctness."},
  { ch:7,q:"Which search checks each element in order from the beginning?", options:["Binary search","Linear search","Heuristic search"], answer:1, why:"Linear search scans one element at a time."},
  { ch:7,q:"Which search REQUIRES the list to be sorted?", options:["Linear search","Binary search","Both equally"], answer:1, why:"Binary search needs sorted, directly accessible data."},
  { ch:7,q:"Binary search finds the middle index using:", options:["mid = (high + low) / 2, rounded down","mid = high - low","mid = numbers.size / 3"], answer:0, why:"Average the bounds and floor the result."},
  { ch:7,q:"In binary search, if the key is greater than the middle element, you next search:", options:["The left (lower) sublist","The right (upper) sublist","The entire list again"], answer:1, why:"Greater key → go to the upper half."},
  { ch:7,q:"For an N-element list, the max steps of binary search is:", options:["N","N / 2","floor(log2 N) + 1"], answer:2, why:"Search space halves each step: logarithmic."},
  { ch:7,q:"For a list of N elements, linear search requires at most:", options:["log2 N comparisons","N comparisons","1 comparison"], answer:1, why:"Worst case checks all N elements."},
  { ch:7,q:"On a sorted list of 500 items, roughly how many comparisons does binary search need?", options:["About 250","Fewer than 10","Exactly 500"], answer:1, why:"Binary search always uses under 10 for 500 items."},
  { ch:7,q:"The worst case for linear search occurs when:", options:["The key is at index 0","The key is not in the list (all elements checked)","The list has one element"], answer:1, why:"Not found = maximum comparisons."},
  { ch:7,q:"An algorithm's best case is the scenario with:", options:["The maximum number of operations","The minimum number of operations","Exactly N operations"], answer:1, why:"Best case = least possible work."},
  { ch:7,q:"Why must input size N remain a variable in complexity analysis?", options:["To make code shorter","Otherwise every best case would be N=0, which is useless","Because memory is fixed"], answer:1, why:"Complexity always treats size as a variable."},
  { ch:7,q:"Binary search checks which element first?", options:["The first element","The middle element","The last element"], answer:1, why:"It starts at the middle of the range."},
  { ch:7,q:"Which correctly describes both searches on a large SORTED list?", options:["Linear is faster than binary","Binary is far faster than linear","They take the same time"], answer:1, why:"Binary halves the space; linear scans all."},
  { ch:7,q:"Computational complexity most commonly measures:", options:["Lines of code and comments","Runtime and memory usage","Number of functions"], answer:1, why:"Resources = runtime + memory."},
  { ch:7,q:"Sorting a list means putting it into:", options:["Random order","Ascending or descending order","Reverse insertion order"], answer:1, why:"Sorting orders the elements."},
  { ch:7,q:"A heuristic algorithm is one that:", options:["Always finds the optimal solution","Quickly finds a near-optimal/approximate solution","Never terminates"], answer:1, why:"Heuristics trade optimality for speed."},
  { ch:7,q:"The 0-1 knapsack problem restricts each item to:", options:["At most 1 of each item","Unlimited copies","At least 2 of each item"], answer:0, why:"0-1 means take each item zero or one times."},
  { ch:7,q:"Two algorithms both correctly sort; Algorithm 2's code is more complex but runs faster. Algorithm 2 is:", options:["Incorrect","More time-efficient","Slower"], answer:1, why:"Faster runtime = more time-efficient (both still correct)."},
  { ch:7,q:"Binary search terminates when:", options:["It reaches index 0","The key is found or the search space is empty","N reaches 100"], answer:1, why:"Found, or no range remains (returns -1)."},

  // ===== CHAPTER 8 =====
  { ch:8,q:"What are the four SDLC phases in order?", options:["Design, Analysis, Testing, Implementation","Analysis, Design, Implementation, Testing","Analysis, Implementation, Design, Testing"], answer:1, why:"Analysis → Design → Implementation → Testing."},
  { ch:8,q:"Which SDLC phase defines a program's goals?", options:["Analysis","Design","Testing"], answer:0, why:"Analysis defines goals."},
  { ch:8,q:"Which SDLC phase defines the specifics of how to build the program?", options:["Analysis","Design","Implementation"], answer:1, why:"Design defines the how."},
  { ch:8,q:"In which SDLC phase is the code written?", options:["Design","Implementation","Testing"], answer:1, why:"Implementation involves writing the program."},
  { ch:8,q:"Which SDLC phase checks that the program meets its goals?", options:["Analysis","Implementation","Testing"], answer:2, why:"Testing verifies against goals."},
  { ch:8,q:"How does waterfall differ from agile?", options:["Waterfall repeats phases; agile does one pass","Waterfall does phases in sequence once; agile does small amounts and repeats","They are identical"], answer:1, why:"Waterfall = one pass; agile = iterative."},
  { ch:8,q:"Which approach is more responsive to user feedback?", options:["Waterfall","Agile","Neither"], answer:1, why:"Agile repeats phases, absorbing feedback."},
  { ch:8,q:"What does UML stand for?", options:["Universal Machine Language","Unified Modeling Language","Unified Method Library"], answer:1, why:"Unified Modeling Language."},
  { ch:8,q:"A structural UML diagram visualizes what?", options:["Dynamic behavior like flow","Static elements like variables and functions","Only user actions"], answer:1, why:"Structural = static elements."},
  { ch:8,q:"A behavioral UML diagram visualizes what?", options:["Static variables and functions","Dynamic behavior, such as flow of an algorithm","Only class inheritance"], answer:1, why:"Behavioral = dynamic behavior."},
  { ch:8,q:"Which UML diagram is structural?", options:["Use case diagram","Class diagram","Sequence diagram"], answer:1, why:"Class diagram is the structural one."},
  { ch:8,q:"Which set of UML diagrams are all behavioral?", options:["Class, use case, activity","Use case, activity, sequence","Class, sequence, activity"], answer:1, why:"Use case, activity, and sequence are behavioral."},
  { ch:8,q:"An activity diagram is best described as a:", options:["Flowchart (behavioral)","Class blueprint (structural)","List of components"], answer:0, why:"Activity diagram is a flowchart, behavioral."},
  { ch:8,q:"A use case diagram is used to model:", options:["How a user interacts with a program","Member variable data types","The order of server responses"], answer:0, why:"Use case shows user interaction."},
  { ch:8,q:"A class diagram is used to model:", options:["How a user interacts with a program","A program's classes with data members and functions","The sequence of events for a scenario"], answer:1, why:"Class diagram models classes."},
  { ch:8,q:"A sequence diagram is used to show:", options:["Static variable types","Interaction between components and the order of events","A list of build components"], answer:1, why:"Sequence shows interactions and event order."},
  { ch:8,q:"Which UML diagram fits the analysis phase?", options:["Use case diagram","Class diagram","Sequence diagram"], answer:0, why:"Analysis → use case diagram."},
  { ch:8,q:"Which UML diagram fits the design phase?", options:["Use case diagram","Class diagram","Activity diagram"], answer:1, why:"Design → class diagram."},
  { ch:8,q:"Which UML diagram fits the implementation phase?", options:["Class diagram","Activity diagram","Sequence diagram"], answer:1, why:"Implementation → activity diagram."},
  { ch:8,q:"Which UML diagram fits the testing phase?", options:["Class diagram","Sequence diagram","Use case diagram"], answer:1, why:"Testing → sequence diagram."},
  { ch:8,q:"Do use case and sequence diagrams contain program code?", options:["Yes, both","No, neither","Only sequence diagrams do"], answer:1, why:"UML diagrams model software, not code."},
  { ch:8,q:"Which UML diagram always indicates the order of events?", options:["Use case diagram","Sequence diagram","Class diagram"], answer:1, why:"Sequence always indicates order; use case does not."},
  { ch:8,q:"In an agile approach, the maximum number of times the implementation phase runs is:", options:["0","1","No max"], answer:2, why:"Agile repeats phases, no max."},
  { ch:8,q:"Can UML diagrams be used in both waterfall and agile approaches?", options:["Yes","No, waterfall only","No, agile only"], answer:0, why:"UML applies to either approach."},

  // ===== CHAPTER 9 =====
  { ch:9,q:"Which kind of language is first converted to an executable, then run?", options:["Compiled","Interpreted","Markup"], answer:0, why:"Compiled = compile to machine code first."},
  { ch:9,q:"Which kind of language is run one statement at a time by another program?", options:["Compiled","Interpreted","Markup"], answer:1, why:"An interpreter runs statements one at a time."},
  { ch:9,q:"C, C++, Java, and C# are what kind of language?", options:["Interpreted","Compiled","Markup"], answer:1, why:"These are the PDF's compiled examples."},
  { ch:9,q:"Python, JavaScript, and MATLAB are each what kind of language?", options:["Compiled","Interpreted","Statically typed"], answer:1, why:"These are the PDF's interpreted examples."},
  { ch:9,q:"Which kind of language usually runs faster?", options:["Compiled","Interpreted","They are equal"], answer:0, why:"Compiled languages run faster."},
  { ch:9,q:"Which kind of language is more portable to different machines?", options:["Compiled","Interpreted","Neither"], answer:1, why:"Interpreted runs on any machine with an interpreter."},
  { ch:9,q:"In a language where a variable's type must be declared and cannot change, the language is:", options:["Dynamically typed","Statically typed","Markup"], answer:1, why:"Static = unchanging type."},
  { ch:9,q:"Which languages are given as statically typed examples?", options:["C, C++, Java","Python","HTML"], answer:0, why:"C, C++, Java are the PDF's static examples."},
  { ch:9,q:"Which language is the PDF's example of a dynamically typed language?", options:["C++","Python","Java"], answer:1, why:"Python is the popular dynamic example."},
  { ch:9,q:"In a dynamically typed language, an integer x later assigned 3.14 becomes:", options:["An integer","A float","An error"], answer:1, why:"Dynamic type changes to match the value."},
  { ch:9,q:"In a statically typed language, assigning an integer variable with 'Hello there' usually:", options:["Reports an error","Changes the type to string","Runs fine"], answer:0, why:"Static reports type errors at compile time."},
  { ch:9,q:"An object consists of:", options:["Only variables","Internal data plus operations on that data","Only functions"], answer:1, why:"Object = data + operations."},
  { ch:9,q:"Which language is NOT considered object-oriented?", options:["C","C++","Java"], answer:0, why:"C does not support objects."},
  { ch:9,q:"Which languages provide extensive object-oriented support?", options:["C, MATLAB, HTML","C++, Java, Python, C#","HTML and XML"], answer:1, why:"These four have extensive OO support."},
  { ch:9,q:"How does a markup language differ from a programming language?", options:["It runs faster","It describes formatting and is not executed statement-by-statement","It must be compiled first"], answer:1, why:"Markup is rendered, not executed."},

{comp:1, ch:"5", q:"What does index reference?", a:"The index references an element's position (location number) within the array; it is the number placed in brackets to directly access that specific element. In Coral indices start at 0, so the first element is index 0 and the last is size-1. The index can be an expression (like a loop variable i), but must be an integer.", d:"myArray[2]   // index 2 -> the 3rd element\nuserVals[i]  // index from variable i"},
{comp:1, ch:"9", q:"What is the difference between a compiled language and an interpreted language?", a:"A compiled language is first converted by a compiler into machine code that runs on a particular machine, then the executable is run. An interpreted (scripting) language is run one statement at a time by another program called an interpreter, with no separate executable produced first.", d:"Compiled programs run faster; interpreted programs can run on any machine that has an interpreter and are easier for new programmers who don't have to run a compiler."},
{comp:1, ch:"9", q:"Which languages are compiled?", a:"C, C++, Java, and C#.", d:"These are the exact examples the PDF lists for compiled languages (converted to machine code by a compiler before running)."},
{comp:1, ch:"9", q:"Which languages are interpreted?", a:"Python, JavaScript, and MATLAB.", d:"These are the exact examples the PDF lists for interpreted (aka scripting) languages, each run by an interpreter."},
{comp:1, ch:"9", q:"What is the difference between statically typed and dynamically typed languages?", a:"In a statically typed language each variable's type must be declared and cannot change while the program runs ('static' = unchanging). In a dynamically typed language a variable's type may change during execution, usually based on what is assigned to it ('dynamic' = changing).", d:"Static languages are often considered safer because they report type errors during compilation (e.g. assigning an integer with a string); dynamic languages are considered easier when types need to change. Most compiled languages are static and many interpreted languages are dynamic."},
{comp:1, ch:"9", q:"Which languages are statically typed?", a:"C, C++, and Java (most compiled languages are statically typed).", d:"The PDF names C, C++, and Java as the popular statically-typed examples."},
{comp:1, ch:"9", q:"Which languages are dynamically typed?", a:"Python (many interpreted languages are dynamically typed).", d:"The PDF names Python as the popular dynamically-typed example; interpreted languages tend to be dynamic."},
{comp:1, ch:"9", q:"What is the difference between an object-oriented language and a non-object-oriented language?", a:"An object-oriented language supports decomposing a program into objects (each object being internal data plus operations on that data). A non-object-oriented language does not support this grouping into objects.", d:"Grouping related variables and functions into objects makes large programs more understandable, manageable, and properly-executing. The PDF uses RunnerInfo/CrowdInfo objects as the example."},
{comp:1, ch:"9", q:"Which languages are object oriented?", a:"C++, Java, Python, and C# provide extensive object-oriented support; MATLAB and JavaScript provide some support.", d:"The '++' in C++ suggests C++ improves on C largely by adding object support."},
{comp:1, ch:"9", q:"Which languages are not object oriented?", a:"C is not object-oriented — it does not support objects.", d:"The PDF explicitly states 'C does not' support objects, contrasting it with C++."},
{comp:1, ch:"9", q:"How does a markup language differ from a programming or scripting language?", a:"A markup language (like HTML) describes a document's content, formatting, or features rather than expressing logic. It is NOT executed statement-by-statement like a programming language, and a markup file is not a program — a web browser reads it and renders the corresponding page.", d:"HTML surrounds text with tags (like h1 or u) to yield different formatting; it is not compiled into an executable and is not run one statement at a time."},
{comp:1, ch:"9", q:"What is a programming library?", a:"A library is a set of pre-written functions (and other items) that carry out common tasks, which a programmer can include and then use.", d:"A library's functions typically all relate to the same purpose (like computing statistics or displaying graphics), and a library holds many functions, not just one."},

{comp:2, ch:"4", q:"How is an infinite loop created?", a:"By writing a loop whose expression never becomes false — usually by forgetting to update the variable tested in the condition, or by an expression whose false case is never reachable.", d:"while userNum == 1 without a new 'userNum = Get next input' in the body loops forever."},
{comp:2, ch:"4", q:"What is a sentinel value?", a:"A special value that signals the end of an input list, such as 0 or a negative number. The loop reads values until it hits the sentinel, which is not included in the computation.", d:"In 10 1 6 3 0, the 0 is the sentinel and is excluded from the average."},
{comp:2, ch:"4", q:"What are the three parts of a loop?", a:"Loop variable initialization (before the loop), the loop expression / decision statement, and the loop variable update (at the end of the body).", d:"for i = 0; i < 3; i = i + 1 — init: i = 0; expression: i < 3; update: i = i + 1."},
{comp:2, ch:"4", q:"What is the difference between a while loop and a do/while loop?", a:"A while loop checks its condition before the body, so it may run zero times. A do-while loop runs the body first and then checks the condition, so it always runs at least once.", d:"do { ... } while userNum > 4 executes the body even if userNum starts at 4 or less."},
