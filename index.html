<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WGU D278 — Study + Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Force the classic JSX runtime (React.createElement) so this inline script
  // works without ES module imports. Babel 8 defaults to the automatic runtime,
  // which emits an `import` statement and breaks a plain <script type="text/babel">.
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
  });
</script>
<style id="shellCSS">
  html,body{margin:0}
  #topTabs{position:sticky;top:0;z-index:50;display:flex;background:#0f172a;border-bottom:1px solid #1e293b}
  .apptab{flex:1;font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;color:#94a3b8;background:none;border:none;border-bottom:3px solid transparent;padding:13px 8px;cursor:pointer;letter-spacing:.3px}
  .apptab.active{color:#fff;border-bottom-color:#2dd4bf}
  .apptab:active{transform:none}
  #gamePane{height:calc(100vh - 50px)}
  #gameFrame{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div id="topTabs">
    <button class="apptab active" id="tab-study" onclick="showApp('study')">📖 Study</button>
    <button class="apptab" id="tab-game" onclick="showApp('game')">🎮 Game</button>
  </div>
  <div id="studyPane"><div id="root"></div></div>
  <div id="gamePane" style="display:none"><iframe id="gameFrame" title="D278 Exam Game" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;D278 Exam Game&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Karla:wght@400;500;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
  :root{
    --paper:#F3F5F1; --ink:#26302B; --dim:#5C6B62; --line:#DDE3DC;
    --u1:#3E7CB1; --u1s:#E4EEF6;
    --u2:#C4682E; --u2s:#F8EADF;
    --u3:#4E8D6E; --u3s:#E3F0E9;
    --u4:#7A5FA0; --u4s:#ECE6F2;
    --u5:#2E8B9E; --u5s:#E1EFF2;
    --u6:#B0567F; --u6s:#F6E7EF;
    --u7:#9C7A1E; --u7s:#F3EDDB;
    --u8:#5566A6; --u8s:#E7EAF5;
    --u9:#4F7A5B; --u9s:#E4EFE8;
    --u10:#9A5D3D; --u10s:#F4E9E1;
    --u11:#6E6E9E; --u11s:#EAEAF4;
    --miss:#B04747; --misss:#FBEAEA;
    --gold:#E8B84B; --hook:#7A5FA0;
    --ok:#4E8D6E; --bad:#B04747;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:'Karla',sans-serif;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
  h1,h2,h3,.btn,.mode-title,.tag{font-family:'Sora',sans-serif}

  /* HEADER */
  header{text-align:center;padding:10px 0 4px}
  .kicker{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-family:'Sora',sans-serif}
  h1{font-size:26px;font-weight:800;margin-top:4px}
  header p{color:var(--dim);font-size:13px;margin-top:4px}

  /* HOME */
  .mode-card{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin-top:14px;cursor:pointer;transition:transform .12s;font-family:inherit}
  .mode-card:active{transform:scale(.98)}
  .mode-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
  .mode-emoji{font-size:22px}
  .mode-sub{color:var(--dim);font-size:13px;margin-top:5px;line-height:1.45}
  .miss-card{background:var(--misss);border-color:#E5C4C4}
  .miss-card .mode-title{color:var(--miss)}

  /* DECK PICKER */
  .deck-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
  .deck-btn{flex:1 1 44%;font-family:'Sora',sans-serif;font-size:12.5px;font-weight:700;padding:12px 8px;
    border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--dim);cursor:pointer}
  .deck-btn.active{color:#fff}
  .deck-btn.d0.active{background:var(--ink);border-color:var(--ink)}
  .deck-btn.d1.active{background:var(--u1);border-color:var(--u1)}
  .deck-btn.d2.active{background:var(--u2);border-color:var(--u2)}
  .deck-btn.d3.active{background:var(--u3);border-color:var(--u3)}
  .deck-btn.d4.active{background:var(--u4);border-color:var(--u4)}
  .deck-btn.d5.active{background:var(--u5);border-color:var(--u5)}
  .deck-btn.dm.active{background:var(--miss);border-color:var(--miss)}
  .deck-btn.d6.active{background:var(--u6);border-color:var(--u6)}
  .deck-btn.d7.active{background:var(--u7);border-color:var(--u7)}
  .deck-btn.d8.active{background:var(--u8);border-color:var(--u8)}
  .deck-btn.d9.active{background:var(--u9);border-color:var(--u9)}
  .deck-btn.d10.active{background:var(--u10);border-color:var(--u10)}
  .deck-btn.d11.active{background:var(--u11);border-color:var(--u11)}

  /* SHARED GAME UI */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .back{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--dim);background:none;border:none;cursor:pointer;padding:8px 8px 8px 0}
  .progress-txt{font-size:12px;color:var(--dim);font-weight:700;font-family:'Sora',sans-serif}
  .pbar{height:6px;background:#E3E8E2;border-radius:6px;overflow:hidden;margin-bottom:16px}
  .pfill{height:100%;border-radius:6px;transition:width .3s;background:var(--ink)}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    padding:4px 12px;border-radius:20px;margin-bottom:12px}
  .t1{background:var(--u1s);color:var(--u1)} .t2{background:var(--u2s);color:var(--u2)}
  .t3{background:var(--u3s);color:var(--u3)} .tm{background:var(--misss);color:var(--miss)}
  .t4{background:var(--u4s);color:var(--u4)}
  .t5{background:var(--u5s);color:var(--u5)}
  .t6{background:var(--u6s);color:var(--u6)}
  .t7{background:var(--u7s);color:var(--u7)}
  .t8{background:var(--u8s);color:var(--u8)}
  .t9{background:var(--u9s);color:var(--u9)}
  .t10{background:var(--u10s);color:var(--u10)}
  .t11{background:var(--u11s);color:var(--u11)}

  /* FLIP CARD */
  .scene{perspective:1100px;height:300px;cursor:pointer;margin-bottom:14px}
  .cardi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .scene.flipped .cardi{transform:rotateY(180deg)}
  @media (prefers-reduced-motion: reduce){.cardi{transition:none}}
  .face{position:absolute;inset:0;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:26px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line)}
  .front{background:#fff}
  .backf{background:var(--ink);color:#F3F5F1;transform:rotateY(180deg)}
  .face-label{font-family:'Sora',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  .backf .face-label{color:#8FA096}
  .kw{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;line-height:1.35}
  .kw.code{font-family:'Karla',monospace;font-size:15px;font-weight:700;white-space:pre-wrap;text-align:left}
  .ans{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;color:var(--gold);line-height:1.3}
  .why{font-size:13.5px;line-height:1.5;margin-top:12px;color:#D4DCD5}
  .tapnote{font-size:11px;color:var(--dim);margin-top:16px}
  .grade{display:flex;gap:10px}
  .btn{flex:1;font-size:14px;font-weight:700;padding:15px;border-radius:14px;border:none;cursor:pointer;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-again{background:#fff;border:1.5px solid var(--miss);color:var(--miss)}
  .btn-got{background:var(--u3);color:#fff}
  .btn-dark{background:var(--ink);color:#fff}

  /* SPEED MATCH + TRACE */
  .prompt-box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;margin-bottom:14px;min-height:120px;display:flex;flex-direction:column;justify-content:center}
  .prompt-box .kw.code{background:var(--ink);color:#EAF2EC;padding:16px;border-radius:12px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{font-family:'Karla',sans-serif;font-size:14.5px;font-weight:500;text-align:left;padding:14px 16px;border-radius:12px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:pre-wrap}
  .opt.mono{font-family:'Karla',monospace;font-weight:700}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--u3s);border-color:var(--ok);color:var(--ok);font-weight:700}
  .opt.wrong{background:var(--misss);border-color:var(--bad);color:var(--bad)}
  .feedback{font-size:13px;line-height:1.5;margin-top:12px;padding:12px 14px;border-radius:12px;display:none}
  .feedback.show{display:block}
  .fb-ok{background:var(--u3s);color:#2E5A44}
  .fb-bad{background:var(--misss);color:#6B2E2E}
  .streak-row{display:flex;justify-content:center;gap:16px;margin-bottom:12px;font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--dim)}
  .streak-row b{color:var(--ink)}
  .nextbtn{width:100%;margin-top:12px;display:none}
  .nextbtn.show{display:block}

  /* COMPETENCY GROUPS */
  .comp-head{font-family:'Sora',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:16px 2px 7px}
  .comp-head b{color:var(--ink)}
  .deck-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
  .deckbadge{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;background:var(--misss);color:var(--miss);padding:1px 6px;border-radius:10px;vertical-align:middle;font-family:'Sora',sans-serif}

  /* SUB-TOPIC CHIPS + CARD CAPTION */
  .chipdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--miss);margin-left:4px;vertical-align:middle}
  .chiplearn{margin-left:6px;padding:0 3px;border-radius:6px;cursor:pointer}
  .chiplearn:hover{background:rgba(0,0,0,.08)}
  .learnlink{display:inline-block;font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--u1);background:var(--u1s);
    border:none;border-radius:10px;padding:7px 12px;margin-top:10px;cursor:pointer}
  .learnlink:active{transform:scale(.97)}
  .subchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px;justify-content:center}
  .subchip{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;color:var(--dim);cursor:pointer}
  .subchip:active{transform:scale(.97)}
  .subchip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .subchip .ct{opacity:.55}
  .subcap{font-family:'Sora',sans-serif;font-size:11.5px;font-weight:700;color:var(--dim);text-align:center;margin:6px 0 2px}
  .subcap b{color:var(--ink)}

  /* DONE SCREEN */
  .done{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 22px;text-align:center}
  .done-big{font-family:'Sora',sans-serif;font-size:44px;font-weight:800;color:var(--u3)}
  .done-sub{color:var(--dim);font-size:14px;margin:8px 0 18px;line-height:1.5}
  .hidden{display:none}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;

&lt;!-- ============ HOME ============ --&gt;
&lt;div id=&quot;home&quot;&gt;
  &lt;header&gt;
    &lt;div class=&quot;kicker&quot;&gt;D278 · Scripting &amp; Programming · Chapters 1–9 · Game Mode&lt;/div&gt;
    &lt;h1&gt;Exam Game&lt;/h1&gt;
    &lt;p&gt;Same content as your study app — now you play it instead of reading it.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;deck-quick&quot; id=&quot;deckRow&quot;&gt;
    &lt;button class=&quot;deck-btn d0 active&quot; data-deck=&quot;all&quot; onclick=&quot;setDeck('all',this)&quot;&gt;Everything&lt;/button&gt;
    &lt;button class=&quot;deck-btn dm&quot; data-deck=&quot;trap&quot; onclick=&quot;setDeck('trap',this)&quot;&gt;🔴 Exam Traps&lt;/button&gt;
    &lt;button class=&quot;deck-btn dm&quot; id=&quot;weakDeckBtn&quot; data-deck=&quot;weak&quot; style=&quot;display:none&quot; onclick=&quot;setDeck('weak',this)&quot;&gt;📋 Most Missed (0)&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;comp-head&quot;&gt;Competency 1 · Identifies Scripts · &lt;b&gt;40%&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;deck-row&quot;&gt;
    &lt;button class=&quot;deck-btn d1&quot; data-deck=&quot;ch1&quot; onclick=&quot;setDeck('ch1',this)&quot;&gt;Ch 1 · Basics&lt;/button&gt;
    &lt;button class=&quot;deck-btn d4&quot; data-deck=&quot;4&quot; onclick=&quot;setDeck('4',this)&quot;&gt;Ch 2 · Variables&lt;/button&gt;
    &lt;button class=&quot;deck-btn d11&quot; data-deck=&quot;11&quot; onclick=&quot;setDeck('11',this)&quot;&gt;Ch 9 · Languages&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;comp-head&quot;&gt;Competency 2 · Uses Programming Elements · &lt;b&gt;20%&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;deck-row&quot;&gt;
    &lt;button class=&quot;deck-btn d5&quot; data-deck=&quot;5&quot; onclick=&quot;setDeck('5',this)&quot;&gt;Ch 3 · Branches&lt;/button&gt;
    &lt;button class=&quot;deck-btn d6&quot; data-deck=&quot;6&quot; onclick=&quot;setDeck('6',this)&quot;&gt;Ch 4 · Loops&lt;/button&gt;
    &lt;button class=&quot;deck-btn d7&quot; data-deck=&quot;7&quot; onclick=&quot;setDeck('7',this)&quot;&gt;Ch 5 · Arrays&lt;/button&gt;
    &lt;button class=&quot;deck-btn d8&quot; data-deck=&quot;8&quot; onclick=&quot;setDeck('8',this)&quot;&gt;Ch 6 · Functions&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;comp-head&quot;&gt;Competency 3 · Explains Logic &amp; Algorithms · &lt;b&gt;40%&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;deck-row&quot;&gt;
    &lt;button class=&quot;deck-btn d9&quot; data-deck=&quot;9&quot; onclick=&quot;setDeck('9',this)&quot;&gt;Ch 7 · Algorithms&lt;/button&gt;
    &lt;button class=&quot;deck-btn d10&quot; data-deck=&quot;10&quot; onclick=&quot;setDeck('10',this)&quot;&gt;Ch 8 · SDLC/UML&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;subchips&quot; id=&quot;subChips&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;
  &lt;p style=&quot;text-align:center;color:var(--dim);font-size:11px;margin:8px 2px 0&quot;&gt;Tap a chapter to see its sub-topics. Cards tagged &lt;b style=&quot;color:var(--u4)&quot;&gt;✎ optional&lt;/b&gt; are in zyBooks but not on WGU's study list — safe to skip.&lt;/p&gt;

  &lt;button class=&quot;mode-card&quot; id=&quot;resumeCard&quot; style=&quot;display:none;background:var(--ink);border-color:var(--ink)&quot; onclick=&quot;resumeFlip()&quot;&gt;
    &lt;div class=&quot;mode-title&quot; style=&quot;color:#F3F5F1&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;▶️&lt;/span&gt;Resume where you left off&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot; id=&quot;resumeSub&quot; style=&quot;color:#B8C4BC&quot;&gt;&lt;/div&gt;
  &lt;/button&gt;

  &lt;button class=&quot;mode-card&quot; onclick=&quot;startFlip()&quot;&gt;
    &lt;div class=&quot;mode-title&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;🃏&lt;/span&gt;Flip Cards&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot;&gt;Keyword on the front, answer + why on the back. Tap &quot;Again&quot; and the card sneaks back into the deck until you own it.&lt;/div&gt;
  &lt;/button&gt;

  &lt;button class=&quot;mode-card&quot; onclick=&quot;startMatch()&quot;&gt;
    &lt;div class=&quot;mode-title&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;⚡&lt;/span&gt;Speed Match&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot;&gt;The exam's real skill: see the keyword, pick the answer from 4 options. Build a streak. No timer — just you vs. the keywords.&lt;/div&gt;
  &lt;/button&gt;

  &lt;button class=&quot;mode-card&quot; onclick=&quot;startTrace()&quot;&gt;
    &lt;div class=&quot;mode-title&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;🔍&lt;/span&gt;Trace the Output&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot;&gt;A Coral snippet appears — predict exactly what it prints. This is competency 3: read the code, call the output. Pause 3 seconds before you tap.&lt;/div&gt;
  &lt;/button&gt;

  &lt;button class=&quot;mode-card&quot; style=&quot;background:#F4F0F9;border-color:#DECFEE&quot; onclick=&quot;showStudyQ()&quot;&gt;
    &lt;div class=&quot;mode-title&quot; style=&quot;color:var(--u4)&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;📚&lt;/span&gt;Study Questions&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot;&gt;WGU's official review list, grouped by competency. Answers for the chapters you've added; the rest unlock as you go.&lt;/div&gt;
  &lt;/button&gt;

  &lt;button class=&quot;mode-card miss-card&quot; id=&quot;reviewCard&quot; style=&quot;display:none&quot; onclick=&quot;showReview()&quot;&gt;
    &lt;div class=&quot;mode-title&quot;&gt;&lt;span class=&quot;mode-emoji&quot;&gt;📋&lt;/span&gt;Review My Misses&lt;/div&gt;
    &lt;div class=&quot;mode-sub&quot; id=&quot;reviewSub&quot;&gt;&lt;/div&gt;
  &lt;/button&gt;

  &lt;p style=&quot;text-align:center;color:var(--dim);font-size:11.5px;margin-top:18px&quot; id=&quot;saveNote&quot;&gt;
    Loading your progress…
  &lt;/p&gt;
&lt;/div&gt;

&lt;!-- ============ FLIP ============ --&gt;
&lt;div id=&quot;flip&quot; class=&quot;hidden&quot;&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;button class=&quot;back&quot; onclick=&quot;goHome()&quot;&gt;← Home&lt;/button&gt;
    &lt;span class=&quot;progress-txt&quot; id=&quot;flipProg&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pbar&quot;&gt;&lt;div class=&quot;pfill&quot; id=&quot;flipBar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div style=&quot;text-align:center&quot;&gt;&lt;span class=&quot;tag&quot; id=&quot;flipTag&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;subcap&quot; id=&quot;flipSub&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;scene&quot; id=&quot;scene&quot; onclick=&quot;this.classList.toggle('flipped')&quot;&gt;
    &lt;div class=&quot;cardi&quot;&gt;
      &lt;div class=&quot;face front&quot;&gt;
        &lt;div class=&quot;face-label&quot;&gt;The exam says…&lt;/div&gt;
        &lt;div class=&quot;kw&quot; id=&quot;flipQ&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;tapnote&quot;&gt;tap to reveal →&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;face backf&quot;&gt;
        &lt;div class=&quot;face-label&quot;&gt;Your answer&lt;/div&gt;
        &lt;div class=&quot;ans&quot; id=&quot;flipA&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;why&quot; id=&quot;flipW&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grade&quot;&gt;
    &lt;button class=&quot;btn btn-again&quot; onclick=&quot;grade(false)&quot;&gt;↺ Again&lt;/button&gt;
    &lt;button class=&quot;btn btn-got&quot; onclick=&quot;grade(true)&quot;&gt;✓ Got it&lt;/button&gt;
  &lt;/div&gt;
  &lt;div style=&quot;text-align:center&quot;&gt;&lt;button class=&quot;learnlink&quot; id=&quot;flipLearn&quot; style=&quot;display:none&quot;&gt;📖 Learn this in the study app&lt;/button&gt;&lt;/div&gt;

{q:'An if whose false side has no statements', a:'if branch', why:'Runs its block when true, otherwise just continues.', g:5, c:'branch'},
{q:'if · elseif · elseif · else — how many branches run?', a:'Exactly one', why:'The first true condition runs; the rest are skipped.', g:5, c:'branch', m:1},
{q:'Several separate if statements in a row — how many can run?', a:'More than one', why:'Each if is independent (unlike if-elseif, where only one runs).', g:5, c:'branch', m:1},
{q:'An if-else placed inside another branch', a:'Nested branch (nested if-else)', why:'A branch can contain more branches.', g:5, c:'branch'},
{q:'In if-elseif, the final catch-all that runs if nothing matched', a:'else', why:'Handles every remaining case.', g:5, c:'branch'},
// -- equality operators (3.3) --
{q:'The operator that tests “are these equal?”', a:'==  (two equals signs)', why:'x == 3 is true when x is 3. It’s ==, not =.', g:5, c:'eqop', m:1},
{q:'The operator that tests “are these different?”', a:'!=', why:'x != 3 is true when x is not 3.', g:5, c:'eqop'},
{q:'Does == work reliably for all data types?', a:'No — not for floats', why:'Fine for integers; float representation is imprecise.', g:5, c:'eqop', m:1},
{q:'= versus == in a branch', a:'= assigns, == compares', why:'Mixing them is a classic branch bug.', g:5, c:'eqop', m:1},
// -- relational operators (3.3) --
{q:'The four relational operators', a:'&lt;  &gt;  &lt;=  &gt;=', why:'less-than, greater-than, less-or-equal, greater-or-equal.', g:5, c:'relop', m:1},
{q:'Is “=&lt;” a valid operator?', a:'No — it must be &lt;=', why:'Only the shown two-char sequences are valid; =&lt; and =&gt; are wrong.', g:5, c:'relop', m:1},
{q:'What does a Boolean expression evaluate to?', a:'true or false', why:'A Boolean has just two values.', g:5, c:'relop'},
{q:'With x = 3, is x &lt;= 3 true or false?', a:'True', why:'&lt;= includes equal.', g:5, c:'relop'},
// -- logical operators (3.5) --
{q:'The three logical operators in Coral', a:'and, or, not', why:'Coral writes them as words.', g:5, c:'logop', m:1},
{q:'(a) and (b) is true when…', a:'BOTH operands are true', why:'Either one false makes the whole thing false.', g:5, c:'logop', m:1},
{q:'(a) or (b) is true when…', a:'At least one operand is true', why:'Only false when both are false.', g:5, c:'logop', m:1},
{q:'not(a) evaluates to…', a:'The opposite of a', why:'not(true)=false, not(false)=true.', g:5, c:'logop'},
{q:'How to write “x is between 0 and 10” in Coral', a:'(0 &lt; x) and (x &lt; 10)', why:'You can’t chain it like math: 0 &lt; x &lt; 10 is wrong.', g:5, c:'logop', m:1},
// -- precedence (3.6) --
{q:'Operator precedence, high → low (Ch 3)', a:'( ) → not → arithmetic → relational → equality → and → or', why:'and binds tighter than or.', g:5, c:'prec3', m:1},
{q:'Precedence order among the logical operators', a:'not → and → or', why:'not highest, or lowest.', g:5, c:'prec3', m:1},
{q:'x == 5 or y == 10 and z != 10 groups as…', a:'(x == 5) or ((y == 10) and (z != 10))', why:'and binds tighter than or.', g:5, c:'prec3', m:1},
{q:'Do relational operators evaluate before equality operators?', a:'Yes — &lt; &lt;= &gt; &gt;= before == !=', why:'Relational sits higher on the precedence table.', g:5, c:'prec3'},
// -- floating-point comparison (3.8) --
{q:'How should you compare two floats for equality?', a:'Check they’re close enough: AbsoluteValue(x - y) &lt; 0.0001', why:'Never use == on floats.', g:5, c:'floatcmp', m:1},
{q:'The tiny threshold for “close enough” float comparison', a:'Epsilon (often 0.0001)', why:'The allowed difference to treat two floats as equal.', g:5, c:'floatcmp'},

// ========== GROUP 6 · CHAPTER 4 — Loops ==========
{q:&quot;What is a loop?&quot;, a:&quot;A program construct that repeatedly executes the loop body while the loop's expression is true&quot;, why:&quot;When false, execution proceeds past the loop.&quot;, g:6, c:&quot;concept&quot;},
{q:&quot;loop body&quot;, a:&quot;The statements a loop repeatedly executes&quot;, why:&quot;Runs once per iteration.&quot;, g:6, c:&quot;looppart&quot;},
{q:&quot;iteration&quot;, a:&quot;One execution of the loop body&quot;, why:&quot;Each pass through the loop = 1 iteration.&quot;, g:6, c:&quot;looppart&quot;},
{q:&quot;When is a loop's expression checked?&quot;, a:&quot;Before entering the body (for while/for); if true, body runs&quot;, why:&quot;False = skip/exit the loop.&quot;, g:6, c:&quot;concept&quot;},
{q:&quot;What are the three parts of a loop that iterates N times?&quot;, a:&quot;Loop variable initialization, loop expression, loop variable update&quot;, why:&quot;Init before, expression decides, update at body's end.&quot;, g:6, c:&quot;looppart&quot;, m:1},
{q:&quot;Where does the loop variable initialization go?&quot;, a:&quot;Before the loop&quot;, why:&quot;e.g. i = 0.&quot;, g:6, c:&quot;looppart&quot;},
{q:&quot;Where does the loop variable update go?&quot;, a:&quot;At the end of the loop body&quot;, why:&quot;e.g. i = i + 1.&quot;, g:6, c:&quot;looppart&quot;},
{q:&quot;infinite loop&quot;, a:&quot;A loop that never stops iterating&quot;, why:&quot;Common bug in loops.&quot;, g:6, c:&quot;infinite&quot;, m:1},
{q:&quot;How is an infinite loop accidentally created?&quot;, a:&quot;Forgetting to update a variable in the body, or an expression that never becomes false&quot;, why:&quot;e.g. forgetting to Get next input again.&quot;, g:6, c:&quot;infinite&quot;, m:1},
{q:&quot;Common error: using the opposite loop expression&quot;, a:&quot;Using x == 0 instead of x != 0&quot;, why:&quot;Expression says when to iterate, NOT when to exit.&quot;, g:6, c:&quot;infinite&quot;, m:1},
{q:&quot;sentinel value&quot;, a:&quot;A special value indicating the end of a list&quot;, why:&quot;e.g. 0 ends 10 1 6 3 0; not counted.&quot;, g:6, c:&quot;sentinel&quot;, m:1},
{q:&quot;Is the sentinel included in the computation?&quot;, a:&quot;No&quot;, why:&quot;The 0 in 10 1 6 3 0 is not part of the average.&quot;, g:6, c:&quot;sentinel&quot;},
{q:&quot;while loop&quot;, a:&quot;A loop that repeatedly executes the body while its expression is true&quot;, why:&quot;Keyword: while &lt;expression&gt;.&quot;, g:6, c:&quot;looptype&quot;},
{q:&quot;for loop&quot;, a:&quot;A loop with init, expression, and update that typically iterates a set number of times&quot;, why:&quot;for i = 0; i &lt; n; i = i + 1.&quot;, g:6, c:&quot;looptype&quot;},
{q:&quot;do-while loop&quot;, a:&quot;A loop that runs the body first, then checks the condition&quot;, why:&quot;Body always executes at least once.&quot;, g:6, c:&quot;dowhile&quot;, m:1},
{q:&quot;Which loop is guaranteed to run its body at least once?&quot;, a:&quot;do-while loop&quot;, why:&quot;Condition checked AFTER the body.&quot;, g:6, c:&quot;dowhile&quot;, m:1},
{q:&quot;Which loop when you're unsure how many iterations?&quot;, a:&quot;while loop&quot;, why:&quot;e.g. iterate until input is 'q'.&quot;, g:6, c:&quot;looptype&quot;, m:1},
{q:&quot;Which loop when you know how many iterations?&quot;, a:&quot;for loop&quot;, why:&quot;e.g. loop 10 times.&quot;, g:6, c:&quot;looptype&quot;, m:1},
{q:&quot;Coral for-loop syntax&quot;, a:&quot;for i = 0; i &lt; 3; i = i + 1&quot;, why:&quot;Semicolons separate the 3 parts; no trailing semicolon.&quot;, g:6, c:&quot;syntax&quot;},
{q:&quot;How many semicolons in a Coral for loop header?&quot;, a:&quot;Two (between the three parts)&quot;, why:&quot;for init; expr; update — none at the end.&quot;, g:6, c:&quot;syntax&quot;},
{q:&quot;Read one value from input in Coral&quot;, a:&quot;val = Get next input&quot;, why:&quot;Fetches the next input value.&quot;, g:6, c:&quot;syntax&quot;},
{q:&quot;Print a value in Coral&quot;, a:&quot;Put val to output&quot;, why:&quot;Put \&quot;\\n\&quot; to output for a newline.&quot;, g:6, c:&quot;syntax&quot;},
{q:&quot;To loop exactly N times with i=0, what expression?&quot;, a:&quot;i &lt; N&quot;, why:&quot;i &lt; 10 loops 10 times (i = 0..9).&quot;, g:6, c:&quot;looppart&quot;, m:1},
{q:&quot;for i = 0; i &lt; 3, what values does i take inside the body?&quot;, a:&quot;0, 1, 2&quot;, why:&quot;Stops when i becomes 3 (test fails).&quot;, g:6, c:&quot;output&quot;},
{q:&quot;How many times does i = 0 (init) execute?&quot;, a:&quot;Once&quot;, why:&quot;Initialization runs a single time before looping.&quot;, g:6, c:&quot;looppart&quot;},
{q:&quot;Can input values change the number of iterations of for i=0;i&lt;10?&quot;, a:&quot;No&quot;, why:&quot;Fixed count loop; input only changes computed values.&quot;, g:6, c:&quot;looptype&quot;},
{q:&quot;Pattern: getting input before AND at end of loop&quot;, a:&quot;Get input before the loop, then again at the body's end&quot;, why:&quot;Priming read + repeated read.&quot;, g:6, c:&quot;concept&quot;},
{q:&quot;A for loop is a compact form of what while pattern?&quot;, a:&quot;i = 0; while i &lt; N { ...; i = i + 1 }&quot;, why:&quot;Init before, update as last body statement.&quot;, g:6, c:&quot;looptype&quot;},
{q:&quot;Can all for loops be rewritten as while loops?&quot;, a:&quot;Yes&quot;, why:&quot;They're equivalent; for just improves readability.&quot;, g:6, c:&quot;looptype&quot;},
{q:&quot;nested loop&quot;, a:&quot;A loop inside the body of another loop&quot;, why:&quot;Called inner loop and outer loop.&quot;, g:6, c:&quot;nested&quot;, opt:1},
{q:&quot;inner loop vs outer loop&quot;, a:&quot;Inner is the loop nested inside; outer contains it&quot;, why:&quot;Inner runs fully on each outer iteration.&quot;, g:6, c:&quot;nested&quot;, opt:1},
{q:&quot;Euclid's algorithm loop condition (GCD)&quot;, a:&quot;while numA % numB &gt; 0&quot;, why:&quot;Loops while the remainder is nonzero.&quot;, g:6, c:&quot;concept&quot;, opt:1},
{q:&quot;To find the max in a list, initialize max to what?&quot;, a:&quot;-1 (for positive lists) or the first value&quot;, why:&quot;So the first comparison works.&quot;, g:6, c:&quot;concept&quot;},
{q:&quot;How do you find a max while looping?&quot;, a:&quot;Compare each value to max-so-far; if greater, replace it&quot;, why:&quot;currValue &gt; maxSoFar.&quot;, g:6, c:&quot;concept&quot;},
{q:&quot;General rule: for vs while&quot;, a:&quot;for when iteration count is pre-computable; while otherwise&quot;, why:&quot;Table 4.6.1 guideline.&quot;, g:6, c:&quot;looptype&quot;, m:1},
{q:&quot;How to halt an infinite loop in the Coral simulator?&quot;, a:&quot;Select Pause or Exit Execution&quot;, why:&quot;An infinite loop may print excessively or stall.&quot;, g:6, c:&quot;infinite&quot;, opt:1},

// ========== GROUP 7 · CHAPTER 5 — Arrays ==========
{q:&quot;array&quot;, a:&quot;A single variable that stores an ordered list of items of one data type, each item directly accessible by index.&quot;, why:&quot;One name, many boxes.&quot;, g:7, c:&quot;array-terms&quot;},
{q:&quot;element&quot;, a:&quot;One item stored in an array.&quot;, why:&quot;Each box holds one element.&quot;, g:7, c:&quot;array-terms&quot;},
{q:&quot;index&quot;, a:&quot;An element's position number in the array; used inside [ ] to access that element.&quot;, why:&quot;Index = which box.&quot;, g:7, c:&quot;array-terms&quot;, m:1},
{q:&quot;First index in Coral&quot;, a:&quot;0 — the first element is at index 0.&quot;, why:&quot;Counting starts at 0.&quot;, g:7, c:&quot;indexing&quot;, m:1},
{q:&quot;Last index of an array with size N&quot;, a:&quot;N - 1.&quot;, why:&quot;size 5 -&gt; last index 4.&quot;, g:7, c:&quot;indexing&quot;, m:1},
{q:&quot;How to declare an integer array of 4 elements&quot;, a:&quot;integer array(4) userVals&quot;, why:&quot;keyword 'array' + size.&quot;, g:7, c:&quot;declaration&quot;},
{q:&quot;How to access element 3 of userVals&quot;, a:&quot;userVals[3]&quot;, why:&quot;brackets hold the index.&quot;, g:7, c:&quot;access&quot;},
{q:&quot;size attribute&quot;, a:&quot;userVals.size gives the number of elements in the array.&quot;, why:&quot;Loops use .size.&quot;, g:7, c:&quot;declaration&quot;, m:1},
{q:&quot;scalar variable&quot;, a:&quot;A single-item (non-array) variable, like a normal integer.&quot;, why:&quot;Opposite of an array.&quot;, g:7, c:&quot;array-terms&quot;},
{q:&quot;vector&quot;, a:&quot;A construct similar to an array used in some languages.&quot;, why:&quot;Array's cousin.&quot;, g:7, c:&quot;array-terms&quot;, opt:1},
{q:&quot;[ ] { } ( ) names&quot;, a:&quot;[ ] brackets, { } braces, ( ) parentheses.&quot;, why:&quot;Brackets = indexing.&quot;, g:7, c:&quot;array-terms&quot;},
{q:&quot;Can an array index be an expression?&quot;, a:&quot;Yes — e.g. userVals[i] uses variable i's value as the index.&quot;, why:&quot;Index is computed.&quot;, g:7, c:&quot;indexing&quot;},
{q:&quot;Must an array index be an integer?&quot;, a:&quot;Yes — the index must be an integer type, never a floating-point value (not even 1.0).&quot;, why:&quot;No float indices.&quot;, g:7, c:&quot;indexing&quot;, m:1},
{q:&quot;Standard loop form to iterate an array&quot;, a:&quot;for i = 0; i &lt; userVals.size; i = i + 1&quot;, why:&quot;0 to size-1.&quot;, g:7, c:&quot;loops&quot;, m:1},
{q:&quot;Why loop condition is i &lt; size, not i &lt;= size&quot;, a:&quot;Valid indices are 0..size-1; i &lt;= size would access an out-of-range element.&quot;, why:&quot;&lt;= overshoots by one.&quot;, g:7, c:&quot;loops&quot;, m:1},
{q:&quot;Out-of-range access&quot;, a:&quot;Accessing an index outside 0..size-1, e.g. userVals[4] when size is 4.&quot;, why:&quot;Classic off-by-one bug.&quot;, g:7, c:&quot;errors&quot;, m:1},
{q:&quot;What Coral does on out-of-range access&quot;, a:&quot;Generates an error message and the program immediately ends.&quot;, why:&quot;Coral crashes cleanly.&quot;, g:7, c:&quot;errors&quot;, m:1},
{q:&quot;Nth oldest person index formula&quot;, a:&quot;oldestPeople[nthPerson - 1] — subtract 1 because indices start at 0.&quot;, why:&quot;1st person -&gt; index 0.&quot;, g:7, c:&quot;indexing&quot;},
{q:&quot;How to assign the first element of scoresList to 77&quot;, a:&quot;scoresList[0] = 77&quot;, why:&quot;first = index 0.&quot;, g:7, c:&quot;access&quot;},
{q:&quot;How to assign the second element of myVals to 555&quot;, a:&quot;myVals[1] = 555&quot;, why:&quot;second = index 1.&quot;, g:7, c:&quot;access&quot;},
{q:&quot;Sum-an-array pattern&quot;, a:&quot;sumVal = 0, then loop adding sumVal = sumVal + userVals[i].&quot;, why:&quot;Init 0, accumulate.&quot;, g:7, c:&quot;algorithms&quot;},
{q:&quot;Max-of-array init value&quot;, a:&quot;maxVal = userVals[0] (peek at first element).&quot;, why:&quot;Never init max to 0.&quot;, g:7, c:&quot;algorithms&quot;, m:1},
{q:&quot;Why init maxVal to 0 is a bug&quot;, a:&quot;0 isn't really the largest seen; with all-negative input the output would wrongly be 0.&quot;, why:&quot;Negatives break 0-init.&quot;, g:7, c:&quot;algorithms&quot;, m:1},
{q:&quot;Find-min correct comparison&quot;, a:&quot;Compare with &lt; (if userVals[i] &lt; minVal), and init minVal = userVals[0].&quot;, why:&quot;&lt; finds smaller.&quot;, g:7, c:&quot;algorithms&quot;},
{q:&quot;Count-negatives correct assignment&quot;, a:&quot;numNegatives = numNegatives + 1, initialized to 0.&quot;, why:&quot;Increment a counter.&quot;, g:7, c:&quot;algorithms&quot;},
{q:&quot;Swapping two variables x and y&quot;, a:&quot;Use a temp: tmpVal = x; x = y; y = tmpVal.&quot;, why:&quot;Third holder needed.&quot;, g:7, c:&quot;swap&quot;, m:1},
{q:&quot;Why x = y; y = x fails to swap&quot;, a:&quot;After x = y, x's old value is lost, so y = x just copies y back — both end up y's value.&quot;, why:&quot;Old value clobbered.&quot;, g:7, c:&quot;swap&quot;, m:1},
{q:&quot;Reversing a list with swaps&quot;, a:&quot;Swap elements 1 and N, 2 and N-1, etc., stopping at the middle.&quot;, why:&quot;Swap from the ends in.&quot;, g:7, c:&quot;swap&quot;},
{q:&quot;Swaps needed to reverse 8 elements&quot;, a:&quot;4 swaps (N/2 for even N).&quot;, why:&quot;Half the count.&quot;, g:7, c:&quot;swap&quot;},
{q:&quot;Which is a valid assignment: itemCounts = x, x = itemCounts + 1, or x = itemCounts[2] + 1?&quot;, a:&quot;x = itemCounts[2] + 1 — you must index an element, not use the array name alone.&quot;, why:&quot;Name alone isn't a value.&quot;, g:7, c:&quot;access&quot;, m:1},
{q:&quot;To iterate an array of size 500 instead of 5, what changes?&quot;, a:&quot;Nothing in the loop — using .size means only the declaration size changes.&quot;, why:&quot;.size adapts automatically.&quot;, g:7, c:&quot;loops&quot;},
{q:&quot;Best variable type for a person's height&quot;, a:&quot;scalar (one value).&quot;, why:&quot;Single number = scalar.&quot;, g:7, c:&quot;array-terms&quot;},
{q:&quot;Best variable type for a soccer team's player numbers&quot;, a:&quot;array (a list of values).&quot;, why:&quot;List = array.&quot;, g:7, c:&quot;array-terms&quot;},

// ========== GROUP 8 · CHAPTER 6 — Functions ==========
{q:&quot;function&quot;, a:&quot;A named list of statements you run by calling its name.&quot;, why:&quot;THE core definition&quot;, g:8, c:&quot;basics&quot;, m:1},
{q:&quot;function definition&quot;, a:&quot;The new function's name plus a block of statements; the name can be any valid identifier.&quot;, why:&quot;Definition vs call&quot;, g:8, c:&quot;basics&quot;},
{q:&quot;function call&quot;, a:&quot;An invocation of a function's name that causes the function's statements to execute.&quot;, why:&quot;Call = run it&quot;, g:8, c:&quot;basics&quot;, m:1},
{q:&quot;local variable&quot;, a:&quot;A variable declared inside a function, accessible only within that function.&quot;, why:&quot;Scope trap&quot;, g:8, c:&quot;scope&quot;, m:1},
{q:&quot;Where does a program begin executing?&quot;, a:&quot;With the Main function.&quot;, why:&quot;Main runs first&quot;, g:8, c:&quot;basics&quot;},
{q:&quot;After a called function's last statement runs, where does execution go?&quot;, a:&quot;Back to the original call location.&quot;, why:&quot;Jump out then back&quot;, g:8, c:&quot;basics&quot;},
{q:&quot;parameter&quot;, a:&quot;A function input specified in the function DEFINITION (like a variable declaration).&quot;, why:&quot;Parameter = definition side&quot;, g:8, c:&quot;params&quot;, m:1},
{q:&quot;argument&quot;, a:&quot;A value provided to a parameter during the function CALL.&quot;, why:&quot;Argument = call side&quot;, g:8, c:&quot;params&quot;, m:1},
{q:&quot;Can an argument be an expression?&quot;, a:&quot;Yes, e.g. 12.0, x, or x * 1.5.&quot;, why:&quot;Args can compute&quot;, g:8, c:&quot;params&quot;},
{q:&quot;How are multiple parameters matched to arguments?&quot;, a:&quot;By position: first param with first arg, second with second, etc.&quot;, why:&quot;Order matters&quot;, g:8, c:&quot;params&quot;, m:1},
{q:&quot;How do you call a function with no parameters?&quot;, a:&quot;Include parentheses with no argument, e.g. PrintSomething().&quot;, why:&quot;Parens still required&quot;, g:8, c:&quot;params&quot;, m:1},
{q:&quot;return variable&quot;, a:&quot;The variable a function assigns to return one value; its value is returned when End is reached.&quot;, why:&quot;How Coral returns&quot;, g:8, c:&quot;return&quot;, m:1},
{q:&quot;How many values can a function return?&quot;, a:&quot;Only one, not two or more.&quot;, why:&quot;Single return trap&quot;, g:8, c:&quot;return&quot;, m:1},
{q:&quot;What does a function call evaluate to?&quot;, a:&quot;Its returned value, so it can appear inside an expression.&quot;, why:&quot;Call = a value&quot;, g:8, c:&quot;return&quot;, m:1},
{q:&quot;Can a function that returns nothing be used in an expression?&quot;, a:&quot;No; it must be used in a statement like OutputData(x, y).&quot;, why:&quot;void ≠ expression&quot;, g:8, c:&quot;return&quot;, m:1},
{q:&quot;return statement&quot;, a:&quot;Explicitly returns the specified value and immediately exits the function.&quot;, why:&quot;return vs implicit End&quot;, g:8, c:&quot;return&quot;, m:1},
{q:&quot;If a function has no return value, its first line says...&quot;, a:&quot;returns nothing.&quot;, why:&quot;Header signature&quot;, g:8, c:&quot;code&quot;},
{q:&quot;If a function returns a value, its first line defines...&quot;, a:&quot;the return variable's type and name, e.g. returns float heightCm.&quot;, why:&quot;Header signature&quot;, g:8, c:&quot;code&quot;},
{q:&quot;Coral function definition header format&quot;, a:&quot;Function Name(comma-separated params) returns &lt;type var&gt; OR returns nothing.&quot;, why:&quot;Exact syntax&quot;, g:8, c:&quot;code&quot;, m:1},
{q:&quot;Is 'Function MyFct(integer userNum + 5) returns nothing' valid?&quot;, a:&quot;No — a parameter is a declaration, not an expression.&quot;, why:&quot;Def side can't compute&quot;, g:8, c:&quot;code&quot;, m:1},
{q:&quot;What happens if you define a function but never call it?&quot;, a:&quot;Its statements never execute.&quot;, why:&quot;Defined ≠ run&quot;, g:8, c:&quot;basics&quot;, m:1},
{q:&quot;Improving readability&quot;, a:&quot;Decomposing a program into functions makes Main easier to read and eases maintenance.&quot;, why:&quot;Reason #1&quot;, g:8, c:&quot;reasons&quot;},
{q:&quot;modular development&quot;, a:&quot;Dividing a program into separate modules developed and tested separately, then integrated.&quot;, why:&quot;Reason&quot;, g:8, c:&quot;reasons&quot;},
{q:&quot;incremental development&quot;, a:&quot;Writing and testing a few statements at a time, then a bit more, and so on.&quot;, why:&quot;Reason&quot;, g:8, c:&quot;reasons&quot;},
{q:&quot;function stub&quot;, a:&quot;A function definition whose statements have not yet been written.&quot;, why:&quot;Plan before coding&quot;, g:8, c:&quot;reasons&quot;, m:1},
{q:&quot;Avoiding redundant statements&quot;, a:&quot;Define a function once and call it from multiple places instead of repeating code.&quot;, why:&quot;DRY reason&quot;, g:8, c:&quot;reasons&quot;},
{q:&quot;Beginner guideline for function length&quot;, a:&quot;Usually no more than ~20 statements (not a strict rule).&quot;, why:&quot;Style guideline&quot;, g:8, c:&quot;reasons&quot;, opt:1},
{q:&quot;Can a function's statements include branches and loops?&quot;, a:&quot;Yes — branches, loops, calls to other functions, and other statements.&quot;, why:&quot;Functions are full blocks&quot;, g:8, c:&quot;branches&quot;},
{q:&quot;Can a function call another function?&quot;, a:&quot;Yes; Main is itself the first function called and calls others.&quot;, why:&quot;Nested calls&quot;, g:8, c:&quot;branches&quot;},
{q:&quot;Array parameter syntax&quot;, a:&quot;Include the word array with unknown size, e.g. integer array(?) numList.&quot;, why:&quot;? = size from arg&quot;, g:8, c:&quot;arrays&quot;, opt:1},
{q:&quot;How do you pass an array as an argument?&quot;, a:&quot;Pass only the array's name, e.g. SomeFct(userNums).&quot;, why:&quot;Name only&quot;, g:8, c:&quot;arrays&quot;, opt:1},
{q:&quot;What does numList.size evaluate to for an array parameter?&quot;, a:&quot;The size of the array passed in as the argument.&quot;, why:&quot;Size follows the arg&quot;, g:8, c:&quot;arrays&quot;, opt:1},

// ========== GROUP 9 · CHAPTER 7 — Algorithms ==========
{q:&quot;Algorithm&quot;, a:&quot;A sequence of steps that solves a problem, generating correct output for any valid input.&quot;, why:&quot;Correctness first, always.&quot;, g:9, c:&quot;algorithms&quot;},
{q:&quot;Correct algorithm test&quot;, a:&quot;Must produce correct output for ALL valid inputs, not just one test case.&quot;, why:&quot;One good test does NOT prove correctness.&quot;, g:9, c:&quot;algorithms&quot;, m:1},
{q:&quot;Computational problem&quot;, a:&quot;Specifies an input, a question about the input answerable by computer, and the desired output.&quot;, why:&quot;Input + question + output.&quot;, g:9, c:&quot;algorithms&quot;},

{q:&quot;Algorithm time efficiency&quot;, a:&quot;The number of calculations required to solve a problem; matters most for very large data sets.&quot;, why:&quot;Fewer calculations = faster.&quot;, g:9, c:&quot;efficiency&quot;},

const STUDY_QUESTIONS = [
{comp:1, ch:&quot;2&quot;, q:&quot;What is the purpose of a variable?&quot;, a:&quot;To hold a value under a name you can reuse and change later.&quot;, d:&quot;A variable is a named box; its value can vary. Ex: numPeople = 5.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;How do you save a value to a variable?&quot;, a:&quot;With an assignment statement: variable = value.&quot;, d:&quot;x = 5 puts 5 into x. The left side must be a single variable.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is a programming expression?&quot;, a:&quot;A combination of variables, literals, and operators that evaluates to a value.&quot;, d:&quot;The right side of every assignment is an expression, like x + 2.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is an identifier?&quot;, a:&quot;A name a programmer creates for a variable or function.&quot;, d:&quot;Built from letters, digits, and underscores — like numApples.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What constitutes a valid identifier?&quot;, a:&quot;Letters/digits/underscores, must start with a letter, case sensitive, and not a reserved word.&quot;, d:&quot;valid: thirdPlace, num_Cars1  ·  invalid: 3rdPlace, _numCars, \&quot;very tall\&quot;, Get.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is a literal?&quot;, a:&quot;A specific value written directly in code.&quot;, d:&quot;The 2 in x + 2 is a literal; so is 98.6 or \&quot;Hello\&quot;.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is an operator?&quot;, a:&quot;A symbol that performs a calculation on its operands.&quot;, d:&quot;+ - * / and % are operators; in a + b, a and b are the operands.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What precedence rules does programming use?&quot;, a:&quot;Parentheses first, then unary minus, then * and /, then + and - — ties left to right.&quot;, d:&quot;5 * x + 1 groups as (5*x)+1. Spacing never changes it.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;How does an integer differ from a float?&quot;, a:&quot;An integer holds whole numbers only; a float holds numbers with a fractional part.&quot;, d:&quot;integer 25 vs float 98.6. Integers count; floats measure.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What happens if you divide two integers? An integer and a float?&quot;, a:&quot;Two integers → integer division (truncates). If one is a float → true division.&quot;, d:&quot;7 / 2 = 3, but 7 / 2.0 = 3.5.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What happens if you divide a nonzero floating-point number by zero?&quot;, a:&quot;You get Infinity (or -Infinity) — it does NOT crash.&quot;, d:&quot;12.0 / 0.0 → Infinity. (0.0/0.0 → NotANumber. Integer ÷ 0 DOES crash.)&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;How do you convert an item’s type?&quot;, a:&quot;Type conversion — Coral does it implicitly, or you cast by multiplying an integer by 1.0.&quot;, d:&quot;n * 1.0 makes it a float. float→integer drops the fraction: 4.9 → 4.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What does the modulo operator do?&quot;, a:&quot;It returns the remainder of integer division.&quot;, d:&quot;23 % 10 = 3. It needs integer operands.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is the difference between a variable and a constant?&quot;, a:&quot;A variable’s value can change; a constant’s value cannot.&quot;, d:&quot;Constants are named in UPPER_CASE, like SEC_PER_HOUR = 3600.&quot;},
{comp:1, ch:&quot;2&quot;, q:&quot;What is the purpose of each different data type?&quot;, a:&quot;Each type stores a specific kind of value.&quot;, d:&quot;integer=whole numbers, float=reals, character=one symbol, string=text, Boolean=true/false, array=ordered list.&quot;},
{comp:1, ch:&quot;5&quot;, q:&quot;How does an array work?&quot;, a:&quot;An array is one variable that stores an ordered list of items of the same data type. Instead of many separate variables, all elements live under one name and each is directly accessible by its index. It's declared with a size (integer array(4) userVals), stores a .size attribute, and its elements are read/written individually, typically by looping i from 0 to size-1.&quot;, d:&quot;integer array(4) userVals\nuserVals[0] = 10\nuserVals[1] = 20   // userVals.size is 4&quot;},
{comp:1, ch:&quot;5&quot;, q:&quot;What does index reference?&quot;, a:&quot;The index references an element's position (location number) within the array; it is the number placed in brackets to directly access that specific element. In Coral indices start at 0, so the first element is index 0 and the last is size-1. The index can be an expression (like a loop variable i), but must be an integer.&quot;, d:&quot;myArray[2]   // index 2 -&gt; the 3rd element\nuserVals[i]  // index from variable i&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;What is the difference between a compiled language and an interpreted language?&quot;, a:&quot;A compiled language is first converted by a compiler into machine code that runs on a particular machine, then the executable is run. An interpreted (scripting) language is run one statement at a time by another program called an interpreter, with no separate executable produced first.&quot;, d:&quot;Compiled programs run faster; interpreted programs can run on any machine that has an interpreter and are easier for new programmers who don't have to run a compiler.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are compiled?&quot;, a:&quot;C, C++, Java, and C#.&quot;, d:&quot;These are the exact examples the PDF lists for compiled languages (converted to machine code by a compiler before running).&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are interpreted?&quot;, a:&quot;Python, JavaScript, and MATLAB.&quot;, d:&quot;These are the exact examples the PDF lists for interpreted (aka scripting) languages, each run by an interpreter.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;What is the difference between statically typed and dynamically typed languages?&quot;, a:&quot;In a statically typed language each variable's type must be declared and cannot change while the program runs ('static' = unchanging). In a dynamically typed language a variable's type may change during execution, usually based on what is assigned to it ('dynamic' = changing).&quot;, d:&quot;Static languages are often considered safer because they report type errors during compilation (e.g. assigning an integer with a string); dynamic languages are considered easier when types need to change. Most compiled languages are static and many interpreted languages are dynamic.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are statically typed?&quot;, a:&quot;C, C++, and Java (most compiled languages are statically typed).&quot;, d:&quot;The PDF names C, C++, and Java as the popular statically-typed examples.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are dynamically typed?&quot;, a:&quot;Python (many interpreted languages are dynamically typed).&quot;, d:&quot;The PDF names Python as the popular dynamically-typed example; interpreted languages tend to be dynamic.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;What is the difference between an object-oriented language and a non-object-oriented language?&quot;, a:&quot;An object-oriented language supports decomposing a program into objects (each object being internal data plus operations on that data). A non-object-oriented language does not support this grouping into objects.&quot;, d:&quot;Grouping related variables and functions into objects makes large programs more understandable, manageable, and properly-executing. The PDF uses RunnerInfo/CrowdInfo objects as the example.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are object oriented?&quot;, a:&quot;C++, Java, Python, and C# provide extensive object-oriented support; MATLAB and JavaScript provide some support.&quot;, d:&quot;The '++' in C++ suggests C++ improves on C largely by adding object support.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Which languages are not object oriented?&quot;, a:&quot;C is not object-oriented — it does not support objects.&quot;, d:&quot;The PDF explicitly states 'C does not' support objects, contrasting it with C++.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;How does a markup language differ from a programming or scripting language?&quot;, a:&quot;A markup language (like HTML) describes a document's content, formatting, or features rather than expressing logic. It is NOT executed statement-by-statement like a programming language, and a markup file is not a program — a web browser reads it and renders the corresponding page.&quot;, d:&quot;HTML surrounds text with tags (like h1 or u) to yield different formatting; it is not compiled into an executable and is not run one statement at a time.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;What is a programming library?&quot;, a:&quot;A library is a set of pre-written functions (and other items) that carry out common tasks, which a programmer can include and then use.&quot;, d:&quot;A library's functions typically all relate to the same purpose (like computing statistics or displaying graphics), and a library holds many functions, not just one.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Why are programming libraries used?&quot;, a:&quot;To improve programmer productivity by reusing pre-written functions instead of writing them from scratch.&quot;, d:&quot;After including a library, a programmer can immediately call its functions; a program may include several libraries at once.&quot;},
{comp:1, ch:&quot;9&quot;, q:&quot;Are libraries compiled or precompiled?&quot;, a:&quot;The PDF does not explicitly state whether libraries are compiled or precompiled; it defines a library as a set of pre-written functions that a programmer includes and then uses to improve productivity.&quot;, d:&quot;NOTE: This chapter only describes libraries as 'pre-written functions' that are included and called — it never uses the words 'compiled' or 'precompiled' for libraries. Do not assert a fact the PDF does not state; the exam-relevant point is that libraries are pre-written/reusable functions included to boost productivity.&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;How does a branch differ from a loop?&quot;, a:&quot;A branch runs its block at most once — only when its condition is true.&quot;, d:&quot;if age &gt; 65 runs once when true. (The repeating \&quot;loop\&quot; side is Chapter 4.)&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;How does an if-else branch work?&quot;, a:&quot;If the condition is true the first (if) block runs; otherwise the else block runs — exactly one of the two.&quot;, d:&quot;if age &lt; 25 → price = 4800, else → price = 2200.&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;What does the equality operator do? Does it work for all data types?&quot;, a:&quot;== is true when both sides are equal (!= when different). It works for integers, but should NOT be used on floats.&quot;, d:&quot;numYears == 25 is fine; avoid float1 == float2 (imprecise).&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;What are the four relational operators?&quot;, a:&quot;&lt;, &gt;, &lt;=, &gt;= — less-than, greater-than, less-or-equal, greater-or-equal.&quot;, d:&quot;x &gt;= 3. Note: =&lt; and =&gt; are invalid.&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;What are the three logical operators?&quot;, a:&quot;and (true when both are true), or (true when at least one is true), not (flips true/false).&quot;, d:&quot;(x &gt; 0) and (y &lt; 10).&quot;},
{comp:2, ch:&quot;3&quot;, q:&quot;Explain the precedence rules (relational &amp; logical).&quot;, a:&quot;( ) → not → arithmetic → relational (&lt; &lt;= &gt; &gt;=) → equality (== !=) → and → or; ties left to right.&quot;, d:&quot;x == 5 or y == 10 and z != 10 → (x==5) or ((y==10) and (z!=10)).&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;How is an infinite loop created?&quot;, a:&quot;By writing a loop whose expression never becomes false — usually by forgetting to update the variable tested in the condition, or by an expression whose false case is never reachable.&quot;, d:&quot;while userNum == 1 without a new 'userNum = Get next input' in the body loops forever.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;What is a sentinel value?&quot;, a:&quot;A special value that signals the end of an input list, such as 0 or a negative number. The loop reads values until it hits the sentinel, which is not included in the computation.&quot;, d:&quot;In 10 1 6 3 0, the 0 is the sentinel and is excluded from the average.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;What are the three parts of a loop?&quot;, a:&quot;Loop variable initialization (before the loop), the loop expression / decision statement, and the loop variable update (at the end of the body).&quot;, d:&quot;for i = 0; i &lt; 3; i = i + 1 — init: i = 0; expression: i &lt; 3; update: i = i + 1.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;What is the difference between a while loop and a do/while loop?&quot;, a:&quot;A while loop checks its condition before the body, so it may run zero times. A do-while loop runs the body first and then checks the condition, so it always runs at least once.&quot;, d:&quot;do { ... } while userNum &gt; 4 executes the body even if userNum starts at 4 or less.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;Which control structure is guaranteed to run only one time?&quot;, a:&quot;The do-while loop — because the condition is evaluated after the body, the body is guaranteed to execute at least one time.&quot;, d:&quot;Even if the condition is immediately false, a do-while body has already run once.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;Which loop is used when you are unsure how many times you may need to iterate?&quot;, a:&quot;A while loop — used when the number of iterations is not easily computable ahead of time, such as looping until the input is a certain value.&quot;, d:&quot;while userNum != 0 keeps going until the user enters 0.&quot;},
{comp:2, ch:&quot;4&quot;, q:&quot;Which loop is used when you know how many times you want to iterate?&quot;, a:&quot;A for loop — it bundles the init, expression, and update to naturally describe iterating a specific number of times.&quot;, d:&quot;for i = 0; i &lt; 10; i = i + 1 iterates exactly 10 times.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;What is a function?&quot;, a:&quot;A function is a named list of statements. Its definition consists of the function's name and a block of statements, and the name can be any valid identifier.&quot;, d:&quot;Example: Function PrintPizzaArea() returns nothing. A program's execution begins with the Main function, which is itself a function definition.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;Why are functions useful?&quot;, a:&quot;Functions improve program readability by decomposing a program into pieces, enable modular and incremental development, and avoid redundant statements by being defined once and called from multiple places.&quot;, d:&quot;Decomposing keeps Main easy to read and eases maintenance. Modular development divides a program into separately tested modules; incremental development tests a little at a time; function stubs let a program run before every function is finished. Benefits are readability and less duplication — NOT faster execution.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;What is a function call?&quot;, a:&quot;A function call is an invocation of a function's name that causes the function's statements to execute.&quot;, d:&quot;In code, a call is the function name plus parentheses containing comma-separated arguments (if any), e.g. PrintPizzaArea(12.0) or PrintSomething(). Execution jumps to the function's statements, then returns to the location right after the call. A call to a value-returning function evaluates to that returned value and can appear in an expression.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;What are parameters and arguments?&quot;, a:&quot;A parameter is a function input specified in the function DEFINITION (like a variable declaration). An argument is the value provided to that parameter during the function CALL.&quot;, d:&quot;On a call the parameter's memory is allocated and assigned the argument's value, then deleted on return. Multiple parameters are matched to arguments by position. An argument may be an expression (12.0, x, x * 1.5), but a parameter cannot be an expression — 'MyFct(integer userNum + 5)' is invalid as a definition.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;What happens if you define a function but do not call it?&quot;, a:&quot;Its statements never execute — a function's body only runs when the function is called.&quot;, d:&quot;A program starts at Main; if Main (or some called function) never invokes a given function, that function's block of statements is simply never run. Defining is not the same as calling.&quot;},
{comp:2, ch:&quot;6&quot;, q:&quot;What does a return statement do?&quot;, a:&quot;A return statement returns the specified value and immediately exits the function.&quot;, d:&quot;In Coral a function returns one value by assigning its return variable (named in the header, e.g. returns integer numSquared); the value is returned when End is reached, or explicitly via 'return circleArea'. A function can return only one item, and a call evaluates to that returned value so it can be used inside an expression.&quot;},
{comp:3, ch:&quot;7&quot;, q:&quot;What is a binary search?&quot;, a:&quot;Binary search is a fast algorithm for finding a value in a SORTED, directly accessible list (such as an array). It checks the middle element; if that's the key it returns the location, otherwise it repeats the search on the left sublist (if the key is less than the middle) or the right sublist (if greater), discarding the other half each time. It terminates when the key is found or the search space is empty, returning -1 if not found.&quot;, d:&quot;Because binary search halves the remaining elements every step, its worst case is only floor(log2 N) + 1 comparisons (O(log N)) — e.g. 6 steps for a 32-element list, or fewer than 28 microseconds for 200 million items. mid = (high + low) / 2 rounded down; key &gt; middle sets low = mid + 1, key &lt; middle sets high = mid - 1. Its critical requirement (and common exam trap) is that the data MUST be sorted; on unsorted data it does not work.&quot;},
{comp:3, ch:&quot;7&quot;, q:&quot;What is a linear search?&quot;, a:&quot;Linear search is a search algorithm that starts at the beginning of a list and checks each element one by one until the search key is found or the end of the list is reached. It works on both sorted and unsorted lists and does not require any special ordering.&quot;, d:&quot;For a list of N elements, linear search needs at most N comparisons — 'on the order of' N (O(N)). Best case is 1 comparison (key at index 0); worst case checks all N elements (key not present, or at the last position). At 1 microsecond per comparison a 1,000,000-element list can take up to 1 second, and Amazon's 200M+ items could take over 3 minutes — which is why binary search is preferred on large sorted lists.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What is SDLC?&quot;, a:&quot;The systems development life cycle: the arrangement of phases used to build a program.&quot;, d:&quot;A program can be built using different arrangements of phases comprising the systems development life cycle (SDLC). Its phases define goals, then how to build, then write, then verify the program.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What are the four phases of SDLC?&quot;, a:&quot;Analysis, Design, Implementation, and Testing (in that order).&quot;, d:&quot;Analysis defines the program's goals, design defines the specifics of how to build it, implementation writes the program, and testing checks the program correctly meets the goals.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What activities take place in each of the four phases?&quot;, a:&quot;Analysis = define goals; Design = define how to build; Implementation = write the program (code); Testing = check the program meets the goals.&quot;, d:&quot;Per the PDF: 'Analysis determines the goals for a program. Design determines the specifics of how to build the program. Implementation builds the program according to the design. Testing checks that the program meets the goals.'&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;In which phase do you write code?&quot;, a:&quot;The implementation phase.&quot;, d:&quot;'The implementation phase involves writing the program.' It builds the program according to the design.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;How does a waterfall approach differ from an agile approach?&quot;, a:&quot;Waterfall carries out the SDLC phases in sequence once with no phase repeated; agile (spiral) does small amounts of each phase and then repeats, adding more each cycle.&quot;, d:&quot;Waterfall is named because, like a boat going down a river, no earlier phase is returned to. Agile is more responsive to user feedback, and a single phase in waterfall tends to take longer; agile lets value be delivered sooner (house-room analogy).&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What is UML?&quot;, a:&quot;The Unified Modeling Language, a modeling language for software design that uses different diagram types to visualize the structure and behavior of programs.&quot;, d:&quot;UML consists of several structural and behavioral diagrams. A structural diagram visualizes static elements (variables, functions); a behavioral diagram visualizes dynamic behavior (flow of an algorithm).&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are structural?&quot;, a:&quot;The class diagram (it visualizes static elements like data members and functions).&quot;, d:&quot;The PDF states a UML class diagram 'is a structural diagram' that models classes, data members, and functions. A structural diagram visualizes static elements of software.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are behavioral?&quot;, a:&quot;Use case, activity, and sequence diagrams.&quot;, d:&quot;The PDF explicitly calls the use case diagram, sequence diagram, and activity diagram behavioral. A behavioral diagram visualizes dynamic behavior such as the flow of an algorithm.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are activity?&quot;, a:&quot;The activity diagram, which is a behavioral diagram (a flowchart).&quot;, d:&quot;'A UML activity diagram is a flowchart, similar to zyFlowchart, used to describe the flow of an activity or set of activities.' It is behavioral.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are used in the analysis phase?&quot;, a:&quot;The use case diagram.&quot;, d:&quot;During analysis (defining program goals), a use case diagram can indicate what goals (use cases) the application should carry out.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are used in the design phase?&quot;, a:&quot;The class diagram.&quot;, d:&quot;During design (specifics of how to build), a class diagram can lay out how to group data and functions.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are used in the implementation phase?&quot;, a:&quot;The activity diagram.&quot;, d:&quot;During implementation (writing the program), an activity diagram can describe the program's instructions, branches, loops, etc.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;Which UML diagrams are used in the testing phase?&quot;, a:&quot;The sequence diagram.&quot;, d:&quot;During testing (check that the program meets goals), a sequence diagram can ensure the program generates outputs for given inputs in the expected order.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What is a use case diagram used for?&quot;, a:&quot;To visually model how a user interacts with a software program, including user actions, the accompanying software actions, and connections between software components.&quot;, d:&quot;It is a behavioral diagram often used to specify behavioral requirements of programs. Example: an online shopping system showing how a shopper and external services connect to system components. It contains no code and does not always indicate order of events.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What is a class diagram used for?&quot;, a:&quot;To visually model the classes of a program, including data members and functions.&quot;, d:&quot;It is a structural diagram. A class is a code blueprint for creating an object composed of data members and functions. Class diagrams can show data types, inheritance, and has-a relationships, but not high-level business use cases.&quot;},
{comp:3, ch:&quot;8&quot;, q:&quot;What is a sequence diagram used for?&quot;, a:&quot;To show interaction between software components and indicate the order of events.&quot;, d:&quot;It is a behavioral diagram commonly used to illustrate the sequence of events needed to handle a particular scenario (e.g., a computer and server exchanging search results). Vertical dashed lines are lifelines; horizontal dashed lines are responses.&quot;},
];

    const detail=document.createElement('div'); detail.style.cssText='font-size:12.5px;line-height:1.5;margin-top:6px;color:var(--dim);display:none'; detail.textContent=s.d;
    exBtn.addEventListener('click',function(e){ e.stopPropagation(); const open=detail.style.display!=='none'; detail.style.display=open?'none':'block'; exBtn.textContent=open?'\uff0b example':'\uff0d example'; });

}

async function loadProgress(){
  try{
    let raw = null;
    if(storageOK){ const r = await window.storage.get('d278-progress'); raw = r &amp;&amp; r.value; }

}
let saveTimer=null;
function saveProgress(){
  if(!storageOK &amp;&amp; !localOK) return;

}

// ================= FLIP =================
function startFlip(){
  flipQueue = shuffle(pool()); flipDoneCt=0; flipAgain=0; flipTotal=flipQueue.length;
  if(!flipTotal){ alert('No cards in this deck.'); return; }
  beginFlip();
}
function resumeFlip(){
  const ses = progress.session;
  if(!ses || !ses.queue || !ses.queue.length){ startFlip(); return; }
  deck = ses.deck || 'all';
  const byQ = {}; CARDS.forEach(c=&gt;byQ[c.q]=c);
  flipQueue = ses.queue.map(s=&gt;{ const c = Object.assign({}, byQ[s.q]); if(s.again) c._again=true; return c; }).filter(c=&gt;c.q);
  flipDoneCt = ses.done||0; flipTotal = ses.total||flipQueue.length+flipDoneCt;
  flipAgain = flipQueue.filter(x=&gt;x._again).length;
  if(!flipQueue.length){ startFlip(); return; }
  beginFlip();
}
function beginFlip(){
  document.getElementById('flipDone').classList.add('hidden');
  document.querySelector('#flip .scene').classList.remove('hidden');
  document.querySelector('#flip .grade').style.display='flex';
  saveFlipSession();
  show('flip'); renderFlip();
}
function saveFlipSession(){
  progress.session = { deck, done:flipDoneCt, total:flipTotal,
    queue: flipQueue.map(c=&gt;({q:c.q, again:!!c._again})) };
  saveProgress();
}
function renderFlip(){
  const c = flipQueue[0];
  let [cls,txt] = c.m ? ['tm','🔴 '+tagFor(c)[1]+' · trap'] : tagFor(c);
  if(c.opt) txt = txt + ' · ✎ optional';
  const tag = document.getElementById('flipTag'); tag.className='tag '+cls; tag.textContent=txt;
  const fsub=document.getElementById('flipSub'); if(fsub){ fsub.style.display='block'; fsub.innerHTML='› &lt;b&gt;'+subLabel(c)+'&lt;/b&gt;'; }
  const fl=document.getElementById('flipLearn'); const fsec=secFor(c);
  if(fl){ if(fsec){ fl.style.display='inline-block'; fl.onclick=(e)=&gt;goLearn(fsec,e); } else fl.style.display='none'; }
  document.getElementById('scene').classList.remove('flipped');
  setTimeout(()=&gt;{
    document.getElementById('flipQ').textContent=c.q;
    document.getElementById('flipA').textContent=c.a;
    document.getElementById('flipW').textContent=c.why;
  }, 60);
  document.getElementById('flipProg').textContent = `${flipDoneCt} done · ${flipQueue.length} left` + (flipAgain?` · ${flipAgain} coming back`:'');
  document.getElementById('flipBar').style.width = (flipTotal? (flipDoneCt/flipTotal*100):0)+'%';
}
function grade(got){
  const c = flipQueue.shift();
  if(got){ flipDoneCt++; if(c._again) flipAgain=Math.max(0,flipAgain-1); recordGot(c.q); }
  else { recordMiss(c.q, c.a); c._again=true; flipQueue.splice(Math.min(5,flipQueue.length),0,c); flipAgain = flipQueue.filter(x=&gt;x._again).length; }
  saveFlipSession();
  if(!flipQueue.length){ finishFlip(); return; }
  renderFlip();
}
function finishFlip(){
  progress.session = null; saveProgress(); refreshHomeBadges();
  document.querySelector('#flip .scene').classList.add('hidden');
  document.querySelector('#flip .grade').style.display='none';
  document.getElementById('flipDone').classList.remove('hidden');
  document.getElementById('flipDoneTxt').textContent = `Deck complete — ${flipTotal} cards owned. Every &quot;Again&quot; card came back until you got it. That’s the whole trick.`;
  document.getElementById('flipProg').textContent=''; document.getElementById('flipBar').style.width='100%';
}

// ================= SPEED MATCH =================
function startMatch(){
  matchPool = shuffle(pool()); matchIdx=0; mScore=0; streak=0;
  if(!matchPool.length){ alert('No cards in this deck.'); return; }
  document.getElementById('mScore').textContent=0; document.getElementById('streak').textContent=0;
  show('match'); renderMatch();
}
function distractors(card){
  let same = CARDS.filter(c=&gt;c.c===card.c &amp;&amp; c.a!==card.a);
  let others = CARDS.filter(c=&gt;c.c!==card.c &amp;&amp; c.a!==card.a);
  const seen = new Set([card.a]); const out=[];
  for(const src of [shuffle(same), shuffle(others)]){
    for(const c of src){ if(out.length&gt;=3) break; if(!seen.has(c.a)){ seen.add(c.a); out.push(c.a);} }
  }
  return out;
}
function renderMatch(){
  const c = matchPool[matchIdx];
  let [cls,txt] = c.m ? ['tm','🔴 trap'] : tagFor(c);
  if(c.opt) txt = txt + ' · ✎ opt';
  const tag=document.getElementById('matchTag'); tag.className='tag '+cls; tag.textContent=txt;
  const msub=document.getElementById('matchSub'); if(msub){ msub.style.display='block'; msub.innerHTML='› &lt;b&gt;'+subLabel(c)+'&lt;/b&gt;'; }
  const ml=document.getElementById('matchLearn'); if(ml) ml.style.display='none';
  document.getElementById('matchQ').textContent=c.q;
  document.getElementById('matchProg').textContent = `${matchIdx+1} of ${matchPool.length}`;
  const opts = shuffle([c.a, ...distractors(c)]);
  const wrap = document.getElementById('matchOpts'); wrap.innerHTML='';
  opts.forEach(o=&gt;{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=&gt;pickMatch(b,o===c.a,c); wrap.appendChild(b);
  });
  const fb=document.getElementById('matchFb'); fb.className='feedback'; fb.textContent='';
  document.getElementById('matchNext').classList.remove('show');
}
function pickMatch(btn, right, c){
  document.querySelectorAll('#matchOpts .opt').forEach(b=&gt;{ b.disabled=true; if(b.textContent===c.a) b.classList.add('right'); });
  const fb=document.getElementById('matchFb');
  if(right){ btn.classList.add('right'); mScore++; streak++;
    if(streak&gt;best){ best=streak; progress.best=best; saveProgress(); }
    recordGot(c.q);
    fb.className='feedback show fb-ok'; fb.textContent='✓ '+c.why;
  } else { btn.classList.add('wrong'); streak=0; recordMiss(c.q, c.a);
    fb.className='feedback show fb-bad'; fb.textContent='✗ It’s &quot;'+c.a+'.&quot; '+c.why;
  }
  document.getElementById('mScore').textContent=mScore;
  document.getElementById('streak').textContent=streak;
  document.getElementById('best').textContent=best;
  document.getElementById('matchNext').classList.add('show');
  const ml=document.getElementById('matchLearn'); const msec=secFor(c);
  if(ml){ if(msec){ ml.style.display='inline-block'; ml.onclick=(e)=&gt;goLearn(msec,e); } else ml.style.display='none'; }
}
function nextMatch(){
  matchIdx++;
  if(matchIdx&gt;=matchPool.length){
    const pct = Math.round(mScore/matchPool.length*100);
    document.getElementById('matchQ').textContent = `Round done: ${mScore}/${matchPool.length} (${pct}%). Best streak: ${best}.` + (pct&gt;=80?' Ready.':' Run the traps deck next.');
    document.getElementById('matchOpts').innerHTML='';
    const fb=document.getElementById('matchFb'); fb.className='feedback show '+(pct&gt;=80?'fb-ok':'fb-bad');
    fb.textContent = pct&gt;=80 ? 'That’s a passing pace. Keep the streaks coming.' : 'Every wrong one just taught you something the exam can’t surprise you with anymore.';
    const nb=document.getElementById('matchNext'); nb.textContent='Play again'; nb.onclick=()=&gt;{ nb.textContent='Next →'; nb.onclick=nextMatch; startMatch(); };
    return;
  }
  renderMatch();
}

    // scalar assignment: name = expr

      const name = m[1]; const val = ev(tokenize(m[2]));
      const declared = scope.types && scope.types[name];
      if (val.arr) { scope.vars[name] = val; return null; }
      if (declared === "integer") scope.vars[name] = I(val.v);
      else if (declared === "float") scope.vars[name] = F(val.v);
      else { scope.vars[name] = val.s !== undefined ? val : (val.f ? F(val.v) : I(val.v)); scope.types = scope.types || {}; scope.types[name] = val.f ? "float" : "integer"; }
      return null;
    }
    // bare function call statement
    if ((m = t.match(/^([A-Za-z_]\w*)\s*\((.*)\)$/))) {
      const name = m[1]; const argStr = m[2].trim();
      const args = [];
      if (argStr) {
        // split top-level commas
        splitArgs(argStr).forEach(a => args.push(ev(tokenize(a))));
      }
      callFunction(name, args); return null;
    }
    throw { line: n, msg: `I don't recognize this statement: "${t}"` };
  }
  function splitArgs(s) {
    const out = []; let depth = 0, cur = "";
    for (const c of s) {
      if (c === "(" || c === "[") depth++;
      if (c === ")" || c === "]") depth--;
      if (c === "," && depth === 0) { out.push(cur); cur = ""; } else cur += c;
    }
    if (cur.trim()) out.push(cur);
    return out;
  }
  function guessType(raw) { return raw !== undefined && /[.]/.test(raw) ? "float" : "integer"; }
  function formatVal(val, dec) {
    if (val.s !== undefined) return val.s.replace(/\\n/g, "\n");
    if (val.b) return val.v === 1 ? "true" : "false";
    if (dec !== undefined) return Number(val.v).toFixed(parseInt(dec, 10));
    if (!val.f) return String(Math.trunc(val.v));
    // float formatting
    const v = val.v;
    if (!isFinite(v)) return v > 0 ? "Infinity" : (v < 0 ? "-Infinity" : "NotANumber");
    if (Number.isNaN(v)) return "NotANumber";
    let r = parseFloat(v.toFixed(6));
    if (Number.isInteger(r)) return r.toFixed(1);
    return String(r);
  }

  // ---- run ----
  try {
    const top = parseStmts(rawLines, 0, 0);
    const globalScope = { vars: {}, types: {} };
    if (functions["Main"]) {
      callFunction("Main", []);
    } else {
      execBlock(top.stmts, globalScope);
    }
    // collect simple vars for display
    const display = {};
    for (const k in globalScope.vars) {
      const c = globalScope.vars[k];
      if (c.arr) display[k] = "[" + c.arr.map(e => formatVal(e)).join(", ") + "]";
      else display[k] = formatVal(c);
    }
    return { ok: true, output, vars: display };
  } catch (e) {
    if (e && e.msg) return { ok: false, output, error: `Line ${e.line || "?"}: ${e.msg}` };
    return { ok: false, output, error: "Something went wrong running that program." };
  }
}
