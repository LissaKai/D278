{comp:2, ch:"4", q:"Which loop is used when you know how many times you want to iterate?", a:"A for loop — it bundles the init, expression, and update to naturally describe iterating a specific number of times.", d:"for i = 0; i < 10; i = i + 1 iterates exactly 10 times."},
{comp:2, ch:"6", q:"What is a function?", a:"A function is a named list of statements. Its definition consists of the function's name and a block of statements, and the name can be any valid identifier.", d:"Example: Function PrintPizzaArea() returns nothing. A program's execution begins with the Main function, which is itself a function definition."},
{comp:2, ch:"6", q:"Why are functions useful?", a:"Functions improve program readability by decomposing a program into pieces, enable modular and incremental development, and avoid redundant statements by being defined once and called from multiple places.", d:"Decomposing keeps Main easy to read and eases maintenance. Modular development divides a program into separately tested modules; incremental development tests a little at a time; function stubs let a program run before every function is finished. Benefits are readability and less duplication — NOT faster execution."},
{comp:2, ch:"6", q:"What is a function call?", a:"A function call is an invocation of a function's name that causes the function's statements to execute.", d:"In code, a call is the function name plus parentheses containing comma-separated arguments (if any), e.g. PrintPizzaArea(12.0) or PrintSomething(). Execution jumps to the function's statements, then returns to the location right after the call. A call to a value-returning function evaluates to that returned value and can appear in an expression."},
{comp:2, ch:"6", q:"What are parameters and arguments?", a:"A parameter is a function input specified in the function DEFINITION (like a variable declaration). An argument is the value provided to that parameter during the function CALL.", d:"On a call the parameter's memory is allocated and assigned the argument's value, then deleted on return. Multiple parameters are matched to arguments by position. An argument may be an expression (12.0, x, x * 1.5), but a parameter cannot be an expression — 'MyFct(integer userNum + 5)' is invalid as a definition."},
{comp:2, ch:"6", q:"What happens if you define a function but do not call it?", a:"Its statements never execute — a function's body only runs when the function is called.", d:"A program starts at Main; if Main (or some called function) never invokes a given function, that function's block of statements is simply never run. Defining is not the same as calling."},
{comp:2, ch:"6", q:"What does a return statement do?", a:"A return statement returns the specified value and immediately exits the function.", d:"In Coral a function returns one value by assigning its return variable (named in the header, e.g. returns integer numSquared); the value is returned when End is reached, or explicitly via 'return circleArea'. A function can return only one item, and a call evaluates to that returned value so it can be used inside an expression."},
{comp:3, ch:"7", q:"What is a binary search?", a:"Binary search is a fast algorithm for finding a value in a SORTED, directly accessible list (such as an array). It checks the middle element; if that's the key it returns the location, otherwise it repeats the search on the left sublist (if the key is less than the middle) or the right sublist (if greater), discarding the other half each time. It terminates when the key is found or the search space is empty, returning -1 if not found.", d:"Because binary search halves the remaining elements every step, its worst case is only floor(log2 N) + 1 comparisons (O(log N)) — e.g. 6 steps for a 32-element list, or fewer than 28 microseconds for 200 million items. mid = (high + low) / 2 rounded down; key > middle sets low = mid + 1, key < middle sets high = mid - 1. Its critical requirement (and common exam trap) is that the data MUST be sorted; on unsorted data it does not work."},
{comp:3, ch:"7", q:"What is a linear search?", a:"Linear search is a search algorithm that starts at the beginning of a list and checks each element one by one until the search key is found or the end of the list is reached. It works on both sorted and unsorted lists and does not require any special ordering.", d:"For a list of N elements, linear search needs at most N comparisons — 'on the order of' N (O(N)). Best case is 1 comparison (key at index 0); worst case checks all N elements (key not present, or at the last position). At 1 microsecond per comparison a 1,000,000-element list can take up to 1 second, and Amazon's 200M+ items could take over 3 minutes — which is why binary search is preferred on large sorted lists."},
{comp:3, ch:"8", q:"What is SDLC?", a:"The systems development life cycle: the arrangement of phases used to build a program.", d:"A program can be built using different arrangements of phases comprising the systems development life cycle (SDLC). Its phases define goals, then how to build, then write, then verify the program."},

{comp:3, ch:"8", q:"How does a waterfall approach differ from an agile approach?", a:"Waterfall carries out the SDLC phases in sequence once with no phase repeated; agile (spiral) does small amounts of each phase and then repeats, adding more each cycle.", d:"Waterfall is named because, like a boat going down a river, no earlier phase is returned to. Agile is more responsive to user feedback, and a single phase in waterfall tends to take longer; agile lets value be delivered sooner (house-room analogy)."},

function SectionHead({ children }) {
  return (
    <h3 className="font-mono text-sm tracking-widest uppercase text-teal-700 mb-1">{children}</h3>
  );
}

function Learn({ navSec, onNavDone, ch }) {
  ch = ch || 1;
  const [open, setOpen] = useState("");
  // group lessons by section, filtered to the active chapter
  const groups = [];
  LESSONS.filter((l) => parseInt(l.sec, 10) === ch).forEach((l) => {
    let g = groups.find((x) => x.sec === l.sec);
    if (!g) { g = { sec: l.sec, items: [] }; groups.push(g); }
    g.items.push(l);
  });
  useEffect(() => { setOpen(groups[0] && groups[0].items[0] ? groups[0].items[0].title : ""); }, [ch]);
  useEffect(() => {
    if (!navSec) return;
    const grp = groups.find((g) => g.sec.split(" ")[0] === navSec);
    if (grp) {
      setOpen(grp.items[0].title);
      requestAnimationFrame(() => {
        const el = document.getElementById("sec-" + navSec);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    if (onNavDone) onNavDone();
  }, [navSec]);
  return (
    <div className="space-y-6">
      <p className="text-slate-600 text-sm bg-teal-50 border border-teal-200 rounded-xl p-3">
        Every section of Chapter {ch} as short cards — tap to expand. Hands-on practice is in the Lab and Playground tabs.
      </p>
      {groups.length === 0 && <p className="text-slate-500 text-sm">No lesson cards for this chapter.</p>}
      {groups.map((g) => (
        <div key={g.sec} id={"sec-" + g.sec.split(" ")[0]} style={{ scrollMarginTop: "70px" }}>
          <div className="font-mono text-xs tracking-widest uppercase text-slate-400 mb-2 mt-2">{g.sec}</div>
          <div className="space-y-3">
            {g.items.map((l) => (
              <div key={l.title} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <button
                  onClick={() => setOpen(open === l.title ? "" : l.title)}
                  className="w-full flex items-center justify-between px-5 py-4 text-left"
                >
                  <span className="font-semibold text-slate-900">{l.title}
                    {l.opt && <span className="ml-2 text-[10px] font-mono uppercase tracking-wide text-purple-700 bg-purple-50 border border-purple-200 rounded-full px-2 py-0.5">✎ optional</span>}
                  </span>
                  <span className="font-mono text-teal-700 text-lg">{open === l.title ? "−" : "+"}</span>
                </button>
                {open === l.title && (
                  <div className="px-5 pb-5">
                    <p className="text-slate-700 text-sm leading-relaxed mb-3">{l.body}</p>
                    <pre className="bg-slate-900 text-teal-50 rounded-xl p-4 font-mono text-sm whitespace-pre-wrap">{l.example}</pre>
                    <p className="text-xs text-slate-500 mt-2">↳ {l.note}</p>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ---------- Binary + ASCII lab ----------
function BitLab() {
  const [bits, setBits] = useState([0, 0, 0, 0, 0, 0, 0, 0]);
  const [ch, setCh] = useState("A");
  const weights = [128, 64, 32, 16, 8, 4, 2, 1];
  const decimal = bits.reduce((s, b, i) => s + b * weights[i], 0);
  const code = ch ? ch.charCodeAt(0) : null;

  return (
    <div className="space-y-8">
      <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <SectionHead>Binary builder</SectionHead>
        <p className="text-slate-600 text-sm mb-4">
          Tap bits on and off. The decimal value is the sum of the weights of the 1s. Make your age. Make 255.
        </p>
        <div className="flex flex-wrap gap-2 justify-center mb-4">
          {bits.map((b, i) => (
            <button key={i}
              onClick={() => setBits(bits.map((x, j) => (j === i ? 1 - x : x)))}
              className={`w-14 rounded-xl border-2 py-2 text-center transition-colors ${
                b ? "bg-teal-600 border-teal-700 text-white" : "bg-slate-50 border-slate-300 text-slate-400"}`}>
              <div className="text-2xl font-mono font-bold">{b}</div>
              <div className={`text-xs ${b ? "text-teal-100" : "text-slate-400"}`}>{weights[i]}</div>
            </button>
          ))}
        </div>
        <div className="text-center">
          <span className="text-slate-500 text-sm mr-2">decimal value</span>
          <span className="font-mono text-4xl font-bold text-slate-900">{decimal}</span>
        </div>
        <div className="text-center mt-2 text-xs text-slate-500 font-mono">
          {bits.filter(Boolean).length > 0 ? weights.filter((_, i) => bits[i]).join(" + ") + " = " + decimal : "all bits off = 0"}
        </div>
      </section>

      <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <SectionHead>ASCII lookup</SectionHead>
        <p className="text-slate-600 text-sm mb-4">Every character has a 7-bit code. Type one:</p>
        <div className="flex items-center gap-4 flex-wrap">
          <input value={ch} maxLength={1}
            onChange={(e) => setCh(e.target.value.slice(-1))}
            className="w-16 h-16 text-center text-3xl font-mono border-2 border-slate-300 rounded-xl focus:border-teal-600 focus:outline-none" />
          {code !== null && (
            <div className="flex gap-6">
              <div>
                <div className="text-xs text-slate-500 uppercase tracking-wide">bit code (7-bit)</div>
                <div className="font-mono text-xl font-bold text-slate-900">{code.toString(2).padStart(7, "0")}</div>
              </div>
              <div>
                <div className="text-xs text-slate-500 uppercase tracking-wide">decimal</div>
                <div className="font-mono text-xl font-bold text-slate-900">{code}</div>
              </div>
            </div>
          )}
        </div>
        <p className="text-xs text-slate-500 mt-3">
          Try 'A' (65) vs 'a' (97) — different codes. A space is a character too (32).
        </p>
      </section>
    </div>
  );
}

// ---------- Turtle graphics lab ----------
const TRIANGLE = [
  { op: "penDown" }, { op: "forward", val: 100 }, { op: "left", val: 120 },
  { op: "forward", val: 100 }, { op: "left", val: 120 }, { op: "forward", val: 100 },
];
const SQUARE = [
  { op: "penDown" }, { op: "forward", val: 90 }, { op: "left", val: 90 },
  { op: "forward", val: 90 }, { op: "left", val: 90 }, { op: "forward", val: 90 },
  { op: "left", val: 90 }, { op: "forward", val: 90 },
];
const OP_LABEL = { penUp: "Pen up", penDown: "Pen down", forward: "Forward", left: "Left" };

function TurtleLab() {
  const [ins, setIns] = useState(TRIANGLE);
  const canvasRef = useRef(null);

  const draw = (list) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(0, 0, W, H);

    let x = 0, y = 0, ang = 0, pen = true;
    const segs = [];
    const xs = [0], ys = [0];
    list.forEach((s) => {
      if (s.op === "penUp") pen = false;
      else if (s.op === "penDown") pen = true;
      else if (s.op === "left") ang += s.val || 0;
      else if (s.op === "forward") {
        const nx = x + Math.cos((ang * Math.PI) / 180) * (s.val || 0);
        const ny = y + Math.sin((ang * Math.PI) / 180) * (s.val || 0);
        segs.push({ x1: x, y1: y, x2: nx, y2: ny, pen });
        x = nx; y = ny; xs.push(nx); ys.push(ny);
      }
    });
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 30;
    const spanX = maxX - minX || 1, spanY = maxY - minY || 1;
    const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const tx = (px) => pad + (px - minX) * scale;
    const ty = (py) => H - (pad + (py - minY) * scale); // invert y so 'left' looks counter-clockwise
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#0d9488";
    segs.forEach((sg) => {
      if (!sg.pen) return;
      ctx.beginPath();
      ctx.moveTo(tx(sg.x1), ty(sg.y1));
      ctx.lineTo(tx(sg.x2), ty(sg.y2));
      ctx.stroke();
    });
    // start dot
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.arc(tx(0), ty(0), 4, 0, Math.PI * 2);
    ctx.fill();
  };

  useEffect(() => { draw(ins); }, []); // draw initial triangle on mount

  const add = (op) => {
    const item = op === "forward" ? { op, val: 50 } : op === "left" ? { op, val: 90 } : { op };
    setIns([...ins, item]);
  };
  const remove = (i) => setIns(ins.filter((_, j) => j !== i));
  const move = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= ins.length) return;
    const copy = ins.slice();
    [copy[i], copy[j]] = [copy[j], copy[i]];
    setIns(copy);
  };
  const setVal = (i, v) => setIns(ins.map((s, j) => (j === i ? { ...s, val: Number(v) || 0 } : s)));

  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Turtle graphics</SectionHead>
      <p className="text-slate-600 text-sm mb-4">

// ---------- Instruction reorder lab (1.1.3) ----------
const REORDER_BLOCKS = [
  { id: "double", label: "m = m * 2", fn: (m) => m * 2 },
  { id: "square", label: "m = m * m", fn: (m) => m * m },
  { id: "plus15", label: "m = m + 15", fn: (m) => m + 15 },
];
function ReorderLab() {
  const [order, setOrder] = useState([0, 1, 2]);
  const move = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= order.length) return;
    const copy = order.slice();
    [copy[i], copy[j]] = [copy[j], copy[i]];
    setOrder(copy);
  };
  let m = 5;
  const outputs = [5];
  order.forEach((idx) => { m = REORDER_BLOCKS[idx].fn(m); outputs.push(m); });
  const finalVal = outputs[outputs.length - 1];

  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Reorder & run</SectionHead>
      <p className="text-slate-600 text-sm mb-4">
        The program starts with m = 5, then runs three blocks in order. Reorder them and watch the output change.
        Challenge: can you make the final value exceed 500? Over 1000?
      </p>
      <div className="font-mono text-sm bg-slate-800 text-teal-50 rounded-lg px-3 py-1.5 mb-2">m = 5 · put m</div>
      <div className="space-y-1.5 mb-3">
        {order.map((idx, i) => (
          <div key={idx} className="flex items-center gap-2 bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 font-mono text-sm text-slate-800">
            <span className="flex-1">{REORDER_BLOCKS[idx].label} · put m</span>
            <button onClick={() => move(i, -1)} className="text-slate-500 hover:text-slate-900 px-1">↑</button>
            <button onClick={() => move(i, 1)} className="text-slate-500 hover:text-slate-900 px-1">↓</button>
          </div>
        ))}
      </div>
      <div className="flex items-center justify-between bg-teal-50 border border-teal-200 rounded-lg px-4 py-2">
        <span className="font-mono text-sm text-teal-900">Output: {outputs.join(", ")}</span>
        <span className={`font-mono text-sm font-bold ${finalVal > 1000 ? "text-rose-600" : finalVal > 500 ? "text-amber-600" : "text-slate-600"}`}>
          final = {finalVal}{finalVal > 1000 ? "  🎉 >1000!" : finalVal > 500 ? "  ✓ >500" : ""}
        </span>
      </div>
    </section>
  );
}

};
function BranchLab() {
  const [prog, setProg] = useState("insurance");
  const p = BRANCH_PROGRAMS[prog];
  const [val, setVal] = useState(p.start);
  useEffect(() => { setVal(BRANCH_PROGRAMS[prog].start); }, [prog]);

  for (let i = 0; i < p.branches.length; i++) { if (p.branches[i].test(val)) { taken = i; break; } }

      <SectionHead>Branch tracer</SectionHead>
      <p className="text-slate-600 text-sm mb-4">In an if-elseif chain, exactly <b>one</b> branch runs — the first true one. Change the input and watch which branch fires.</p>

      </div>
      <div className="space-y-2">
        {p.branches.map((b, i) => {
          const isTaken = i === taken;
          const skipped = taken >= 0 && i < taken;
          return (
            <div key={i} className={`rounded-xl px-4 py-2.5 font-mono text-sm border-2 ${isTaken ? "border-teal-600 bg-teal-50 text-teal-900" : skipped ? "border-slate-200 bg-slate-50 text-slate-400 line-through" : "border-slate-200 bg-slate-50 text-slate-500"}`}>
              <span className="font-semibold">{i === 0 ? "if " : b.cond === "else" ? "" : "elseif "}</span>{b.cond}

              {skipped && <span className="ml-2">(false)</span>}
            </div>
          );
        })}
      </div>
      <p className="text-xs text-slate-500 mt-3">↳ Output: <span className="font-mono text-slate-700">{taken >= 0 ? p.branches[taken].out : ""}</span></p>
    </section>
  );
}

// ---- Ch4: Loop trace stepper ----
function LoopLab() {
  const [n, setN] = useState(4);
  const [step, setStep] = useState(0);
  // for i = 0; i < n; i = i + 1 : sum += i  (show each iteration)
  const rows = [];
  let sum = 0;
  for (let i = 0; i < n; i++) { sum += i; rows.push({ i, cond: `${i} < ${n} → true`, sum }); }
  rows.push({ i: n, cond: `${n} < ${n} → false, stop`, sum, done: true });
  const shown = Math.min(step, rows.length);
  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Loop trace stepper</SectionHead>
      <p className="text-slate-600 text-sm mb-3">Step a <span className="font-mono">for i = 0; i &lt; N; i = i + 1</span> loop that adds each i to a running <span className="font-mono">sum</span>. Watch the three loop parts: init, test, update.</p>
      <div className="flex items-end gap-3 mb-4">
        <div><label className="text-xs text-slate-500 uppercase tracking-wide">N</label>
          <input type="number" value={n} min="1" max="12" onChange={(e) => { setN(Math.max(1, Math.min(12, parseInt(e.target.value || "1", 10)))); setStep(0); }} className="w-20 font-mono border-2 border-slate-300 rounded-lg px-3 py-2 focus:border-teal-600 focus:outline-none" /></div>
        <button onClick={() => setStep(Math.min(rows.length, step + 1))} disabled={shown >= rows.length} className="bg-teal-700 hover:bg-teal-800 disabled:opacity-40 text-white font-semibold px-4 py-2 rounded-lg">Step →</button>
        <button onClick={() => setStep(rows.length)} className="bg-slate-700 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-lg">Run all</button>
        <button onClick={() => setStep(0)} className="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-lg">Reset</button>
      </div>
      <table className="w-full text-sm font-mono border border-slate-200 rounded-lg overflow-hidden">
        <thead><tr className="bg-slate-100 text-slate-500 text-xs uppercase"><th className="px-3 py-2 text-left">i</th><th className="px-3 py-2 text-left">test i &lt; N</th><th className="px-3 py-2 text-left">sum</th></tr></thead>
        <tbody>
          {rows.slice(0, shown).map((r, k) => (
            <tr key={k} className={`border-t border-slate-100 ${r.done ? "text-rose-700" : "text-slate-800"}`}>
              <td className="px-3 py-1.5">{r.done ? "—" : r.i}</td><td className="px-3 py-1.5">{r.cond}</td><td className="px-3 py-1.5">{r.sum}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {shown >= rows.length && <p className="text-xs text-slate-500 mt-3">↳ Final sum of 0..{n - 1} is <span className="font-mono text-teal-700">{sum}</span>. The loop ran {n} times.</p>}
    </section>
  );
}

// ---- Ch5: Array visualizer ----
function ArrayLab() {
  const [vals, setVals] = useState([10, 30, -5, 15, 1]);

  const [raw, setRaw] = useState("10 30 -5 15 1");
  const apply = () => { const v = raw.trim().split(/\s+/).map(Number).filter((x) => !Number.isNaN(x)); setVals(v.length ? v : [0]); setI(-1); };
  // compute running accumulator up to index i
  let acc = mode === "max" ? (vals[0] ?? 0) : 0;
  let label = mode === "sum" ? "sum" : mode === "max" ? "maxVal" : "numNeg";
  const upto = i < 0 ? -1 : i;
  if (mode === "max") { acc = vals[0] ?? 0; for (let k = 1; k <= upto; k++) if (vals[k] > acc) acc = vals[k]; }
  else if (mode === "sum") { acc = 0; for (let k = 0; k <= upto; k++) acc += vals[k]; }
  else { acc = 0; for (let k = 0; k <= upto; k++) if (vals[k] < 0) acc++; }

    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Array loop visualizer</SectionHead>
      <p className="text-slate-600 text-sm mb-3">Index above, value inside. Step the standard loop <span className="font-mono">for i = 0; i &lt; arr.size; i = i + 1</span> and watch the accumulator build.</p>

      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {[["sum", "Sum"], ["max", "Find max"], ["neg", "Count negatives"]].map(([k, l]) => (
          <button key={k} onClick={() => { setMode(k); setI(-1); }} className={`px-3 py-1.5 rounded-full text-sm font-semibold border-2 ${mode === k ? "bg-teal-600 border-teal-700 text-white" : "bg-white border-slate-300 text-slate-600"}`}>{l}</button>
        ))}
      </div>
      <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3">
        {vals.map((v, k) => (
          <div key={k} className="text-center">
            <div className="text-[10px] font-mono text-slate-400">[{k}]</div>
            <div className={`w-12 h-12 flex items-center justify-center rounded-lg font-mono font-bold border-2 ${k === i ? "border-teal-600 bg-teal-50 text-teal-800" : k < i ? "border-slate-200 bg-slate-100 text-slate-400" : "border-slate-300 bg-white text-slate-800"}`}>{v}</div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3">
        <button onClick={() => setI(Math.min(vals.length - 1, i + 1))} disabled={i >= vals.length - 1} className="bg-teal-700 hover:bg-teal-800 disabled:opacity-40 text-white font-semibold px-4 py-2 rounded-lg">Step →</button>
        <button onClick={() => setI(-1)} className="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-lg">Reset</button>
        <span className="font-mono text-sm bg-teal-50 text-teal-800 border border-teal-200 rounded-full px-3 py-1">{label} = {i < 0 && mode !== "max" ? 0 : acc}</span>
        {i >= 0 && <span className="font-mono text-xs text-slate-500">at index {i}, value {vals[i]}</span>}
      </div>
      <p className="text-xs text-slate-500 mt-3">↳ For Find max, seed <span className="font-mono">maxVal = arr[0]</span> (not 0) so all-negative lists still work.</p>
    </section>
  );
}

// ---- Ch7: Search race visualizer ----
function SearchLab() {
  const arr = [2, 4, 7, 10, 11, 32, 45, 87];
  const [key, setKey] = useState(10);
  // linear
  let lin = { comps: 0, idx: -1 };
  for (let i = 0; i < arr.length; i++) { lin.comps++; if (arr[i] === key) { lin.idx = i; break; } }
  // binary
  let low = 0, high = arr.length - 1, bin = { comps: 0, idx: -1 }, path = [];
  while (low <= high) { const mid = Math.floor((low + high) / 2); bin.comps++; path.push(mid); if (arr[mid] === key) { bin.idx = mid; break; } else if (arr[mid] < key) low = mid + 1; else high = mid - 1; }
  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Linear vs binary search</SectionHead>
      <p className="text-slate-600 text-sm mb-3">On a <b>sorted</b> array, binary search halves the space each step. Enter a key and compare the comparison counts.</p>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {arr.map((v, k) => (
          <div key={k} className="text-center">
            <div className="text-[10px] font-mono text-slate-400">[{k}]</div>
            <div className={`w-11 h-11 flex items-center justify-center rounded-lg font-mono font-bold border-2 ${v === key ? "border-teal-600 bg-teal-50 text-teal-800" : path.includes(k) ? "border-amber-400 bg-amber-50 text-amber-800" : "border-slate-300 bg-white text-slate-800"}`}>{v}</div>
          </div>
        ))}
      </div>
      <div className="flex items-end gap-3 mb-4">
        <div><label className="text-xs text-slate-500 uppercase tracking-wide">search key</label>
          <input type="number" value={key} onChange={(e) => setKey(parseInt(e.target.value || "0", 10))} className="w-24 font-mono border-2 border-slate-300 rounded-lg px-3 py-2 focus:border-teal-600 focus:outline-none" /></div>
      </div>
      <div className="grid sm:grid-cols-2 gap-3 font-mono text-sm">
        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3"><div className="text-slate-500 text-xs">Linear search</div><div className="text-slate-900">{lin.comps} comparison{lin.comps === 1 ? "" : "s"} → {lin.idx === -1 ? "not found" : "index " + lin.idx}</div></div>
        <div className="bg-teal-50 border border-teal-200 rounded-xl p-3"><div className="text-teal-600 text-xs">Binary search (amber = middles checked)</div><div className="text-teal-900">{bin.comps} comparison{bin.comps === 1 ? "" : "s"} → {bin.idx === -1 ? "not found" : "index " + bin.idx}</div></div>
      </div>
      <p className="text-xs text-slate-500 mt-3">↳ Worst case: linear ≈ N comparisons, binary ≈ ⌊log₂N⌋+1. Binary needs the list sorted.</p>
    </section>
  );
}

// ---------- Quiz ----------
function Quiz({ ch }) {
  ch = ch || 1;
  const QZ = QUIZ.filter((q) => q.ch === ch);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => { setIdx(0); setPicked(null); setScore(0); setDone(false); }, [ch]);
  if (QZ.length === 0) return <p className="text-slate-500 text-sm">No quiz for this chapter.</p>;
  const q = QZ[idx];
  const correct = picked === q.answer;
  const next = () => {
    if (idx + 1 >= QZ.length) setDone(true);
    else { setIdx(idx + 1); setPicked(null); }
  };
  const restart = () => { setIdx(0); setPicked(null); setScore(0); setDone(false); };

  if (done) {
    const pct = Math.round((score / QZ.length) * 100);
    return (
      <div className="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 text-center">
        <div className="font-mono text-6xl font-bold text-slate-900 mb-2">{score}/{QZ.length}</div>
        <p className="text-slate-600 mb-1">
          {pct >= 85 ? "Excellent — you've got this chapter down."
            : pct >= 60 ? "Solid. Review the ones you missed and run it again."
            : "Good start — reread the Learn tab, then try again."}
        </p>
        <button onClick={restart} className="mt-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold px-6 py-2.5 rounded-lg">Retake quiz</button>
      </div>
    );
  }
  return (
    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div className="flex justify-between items-center mb-4">
        <span className="font-mono text-xs text-slate-500">Question {idx + 1} of {QZ.length}</span>
        <span className="font-mono text-xs text-teal-700 font-semibold">score: {score}</span>
      </div>
      <div className="h-1.5 bg-slate-100 rounded-full mb-5">
        <div className="h-1.5 bg-teal-600 rounded-full transition-all" style={{ width: `${(idx / QZ.length) * 100}%` }} />
      </div>
      <p className="text-slate-900 font-medium mb-4 whitespace-pre-wrap">{q.q}</p>
      <div className="space-y-2">
        {q.options.map((opt, i) => {
          let cls = "border-slate-300 bg-slate-50 hover:border-teal-500";
          if (picked !== null) {
            if (i === q.answer) cls = "border-teal-600 bg-teal-50 text-teal-900";
            else if (i === picked) cls = "border-rose-400 bg-rose-50 text-rose-900";
            else cls = "border-slate-200 bg-slate-50 text-slate-400";
          }
          return (
            <button key={i} disabled={picked !== null}
              onClick={() => { setPicked(i); if (i === q.answer) setScore(score + 1); }}
              className={`w-full text-left border-2 rounded-xl px-4 py-3 font-mono text-sm transition-colors ${cls}`}>{opt}</button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`mt-4 rounded-xl px-4 py-3 text-sm ${correct ? "bg-teal-50 border border-teal-200 text-teal-900" : "bg-rose-50 border border-rose-200 text-rose-900"}`}>
          <strong>{correct ? "Correct." : "Not quite."}</strong> {q.why}
        </div>
      )}
      {picked !== null && (
        <button onClick={next} className="mt-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-lg">
          {idx + 1 >= QZ.length ? "See results" : "Next →"}
        </button>
      )}
    </div>
  );
}

const SQ_COMP = { 1: ["Identifies Scripts", "40%"], 2: ["Uses Programming Elements", "20%"], 3: ["Explains Logic & Algorithms", "40%"] };
function SQItem({ s }) {
  const [open, setOpen] = useState(false);
  const [ex, setEx] = useState(false);
  if (s.lock) {
    return (
      <div className="border border-dashed border-slate-300 bg-slate-50 rounded-xl px-4 py-3">
        <div className="text-sm text-slate-400">{s.q}</div>
        <div className="font-mono text-xs font-semibold text-slate-400 mt-1">🔒 unlocks with Chapter {s.lock}</div>
      </div>
    );
  }
  return (
    <div className="border border-slate-200 bg-white rounded-xl px-4 py-3 cursor-pointer" onClick={() => setOpen(!open)}>
      <div className="text-sm font-semibold text-slate-900">{s.q}</div>
      {open && (
        <div className="mt-2">
          <div className="text-sm font-semibold text-teal-700 leading-relaxed">{s.a}</div>
          {s.d && (
            <div>
              <button onClick={(e) => { e.stopPropagation(); setEx(!ex); }}
                className="mt-2 font-mono text-xs font-semibold text-sky-700">{ex ? "− example" : "＋ example"}</button>
              {ex && <div className="text-xs text-slate-500 leading-relaxed mt-1">{s.d}</div>}
            </div>
          )}
        </div>
      )}
      {!open && <div className="font-mono text-[11px] text-slate-400 mt-1">tap to reveal ↓</div>}
    </div>
  );
}

            <button key={t.id} onClick={() => setTab(t.id)}

    </div>

}
