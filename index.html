// ============================================================
//  Coral interpreter — Chapter 1 language subset
//  Supports: integer declarations, assignments, math (+ - * /),
//  Get next input, Put "string" / Put variable to output, // comments
// ============================================================
function runCoral(code, inputText) {
  const vars = {};
  const inputs = inputText.trim().length ? inputText.trim().split(/\s+/) : [];
  let inIdx = 0;
  let output = "";
  const err = (line, msg) => ({ ok: false, output, error: `Line ${line}: ${msg}` });

  const lines = code.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();
    const n = i + 1;
    if (!line || line.startsWith("//")) continue;

    // integer declaration:  integer wage
    let m = line.match(/^integer\s+([A-Za-z][A-Za-z0-9]*)$/);
    if (m) { vars[m[1]] = 0; continue; }

    // Put "string literal" to output
    m = line.match(/^Put\s+"([^"]*)"\s+to\s+output$/);
    if (m) { output += m[1].replace(/\\n/g, "\n"); continue; }

    // Put variable to output
    m = line.match(/^Put\s+([A-Za-z][A-Za-z0-9]*)\s+to\s+output$/);
    if (m) {
      if (!(m[1] in vars)) return err(n, `variable "${m[1]}" was never declared`);
      output += String(vars[m[1]]);
      continue;
    }

    // x = Get next input
    m = line.match(/^([A-Za-z][A-Za-z0-9]*)\s*=\s*Get next input$/);
    if (m) {
      if (!(m[1] in vars)) return err(n, `variable "${m[1]}" was never declared (add: integer ${m[1]})`);
      if (inIdx >= inputs.length) return err(n, "ran out of input values — add more in the Input box");
      const v = Number(inputs[inIdx++]);
      if (Number.isNaN(v)) return err(n, `input "${inputs[inIdx - 1]}" is not a number`);
      vars[m[1]] = v;
      continue;
    }

    // x = expression
    m = line.match(/^([A-Za-z][A-Za-z0-9]*)\s*=\s*(.+)$/);
    if (m) {
      if (!(m[1] in vars)) return err(n, `variable "${m[1]}" was never declared (add: integer ${m[1]})`);
      let expr = m[2];
      expr = expr.replace(/[A-Za-z][A-Za-z0-9]*/g, (name) => {
        if (name in vars) return `(${vars[name]})`;
        return `__UNKNOWN_${name}__`;
      });
      if (expr.includes("__UNKNOWN_")) {
        const bad = expr.match(/__UNKNOWN_([A-Za-z0-9]+)__/)[1];
        return err(n, `variable "${bad}" was never declared`);
      }
      if (!/^[\d\s+\-*/().%]+$/.test(expr)) return err(n, "expression has characters I don't understand");
      try {
        const val = Function(`"use strict"; return (${expr});`)();
        vars[m[1]] = Math.trunc(val);
      } catch (e) {
        return err(n, "couldn't compute that expression");
      }
      continue;
    }

    return err(n, `I don't recognize this statement: "${line}"`);
  }
  return { ok: true, output, vars };
}

// ---------- Turtle graphics lab ----------
const TRIANGLE = [
  { op: "penDown" }, { op: "forward", val: 100 }, { op: "left", val: 120 },
  { op: "forward", val: 100 }, { op: "left", val: 120 }, { op: "forward", val: 100 },
];
const SQUARE = [
  { op: "penDown" }, { op: "forward", val: 90 }, { op: "left", val: 90 },
  { op: "forward", val: 90 }, { op: "left", val: 90 }, { op: "forward", val: 90 },
  { op: "left", val: 90 }, { op: "forward", val: 90 },
];
const OP_LABEL = { penUp: "Pen up", penDown: "Pen down", forward: "Forward", left: "Left" };

function TurtleLab() {
  const [ins, setIns] = useState(TRIANGLE);
  const canvasRef = useRef(null);

  const draw = (list) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(0, 0, W, H);

    let x = 0, y = 0, ang = 0, pen = true;
    const segs = [];
    const xs = [0], ys = [0];
    list.forEach((s) => {
      if (s.op === "penUp") pen = false;
      else if (s.op === "penDown") pen = true;
      else if (s.op === "left") ang += s.val || 0;
      else if (s.op === "forward") {
        const nx = x + Math.cos((ang * Math.PI) / 180) * (s.val || 0);
        const ny = y + Math.sin((ang * Math.PI) / 180) * (s.val || 0);
        segs.push({ x1: x, y1: y, x2: nx, y2: ny, pen });
        x = nx; y = ny; xs.push(nx); ys.push(ny);
      }
    });
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 30;
    const spanX = maxX - minX || 1, spanY = maxY - minY || 1;
    const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    const tx = (px) => pad + (px - minX) * scale;
    const ty = (py) => H - (pad + (py - minY) * scale); // invert y so 'left' looks counter-clockwise
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#0d9488";
    segs.forEach((sg) => {
      if (!sg.pen) return;
      ctx.beginPath();
      ctx.moveTo(tx(sg.x1), ty(sg.y1));
      ctx.lineTo(tx(sg.x2), ty(sg.y2));
      ctx.stroke();
    });
    // start dot
    ctx.fillStyle = "#f43f5e";
    ctx.beginPath();
    ctx.arc(tx(0), ty(0), 4, 0, Math.PI * 2);
    ctx.fill();
  };

  useEffect(() => { draw(ins); }, []); // draw initial triangle on mount

  const add = (op) => {
    const item = op === "forward" ? { op, val: 50 } : op === "left" ? { op, val: 90 } : { op };
    setIns([...ins, item]);
  };
  const remove = (i) => setIns(ins.filter((_, j) => j !== i));
  const move = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= ins.length) return;
    const copy = ins.slice();
    [copy[i], copy[j]] = [copy[j], copy[i]];
    setIns(copy);
  };
  const setVal = (i, v) => setIns(ins.map((s, j) => (j === i ? { ...s, val: Number(v) || 0 } : s)));

  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Turtle graphics</SectionHead>
      <p className="text-slate-600 text-sm mb-4">
        Build an algorithm step by step, then draw it. This is decomposition: a shape broken into basic moves.
        Left turns are counter-clockwise. Try turning the triangle into a square.
      </p>
      <div className="flex flex-wrap gap-2 mb-3">
        {["penDown", "penUp", "forward", "left"].map((op) => (
          <button key={op} onClick={() => add(op)}
            className="bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold px-3 py-1.5 rounded-lg">
            + {OP_LABEL[op]}
          </button>
        ))}
        <button onClick={() => setIns(TRIANGLE)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-3 py-1.5 rounded-lg">Triangle</button>
        <button onClick={() => setIns(SQUARE)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-3 py-1.5 rounded-lg">Square</button>
        <button onClick={() => setIns([])} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold px-3 py-1.5 rounded-lg">Clear</button>
      </div>
      <div className="flex flex-col md:flex-row gap-4">
        <div className="md:w-1/2 space-y-1.5">
          {ins.length === 0 && <p className="text-sm text-slate-400 italic">No steps yet — add some above.</p>}
          {ins.map((s, i) => (
            <div key={i} className="flex items-center gap-2 bg-slate-800 text-teal-50 rounded-lg px-3 py-1.5 font-mono text-sm">
              <span className="flex-1">{OP_LABEL[s.op]}
                {(s.op === "forward" || s.op === "left") && (
                  <input type="number" value={s.val}
                    onChange={(e) => setVal(i, e.target.value)}
                    className="ml-2 w-16 bg-slate-700 rounded px-1 text-white text-sm" />
                )}
              </span>
              <button onClick={() => move(i, -1)} className="text-slate-300 hover:text-white px-1">↑</button>
              <button onClick={() => move(i, 1)} className="text-slate-300 hover:text-white px-1">↓</button>
              <button onClick={() => remove(i)} className="text-rose-300 hover:text-rose-100 px-1">✕</button>
            </div>
          ))}
          <button onClick={() => draw(ins)}
            className="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2 rounded-lg">▶ Run / Draw</button>
        </div>
        <div className="md:w-1/2">
          <canvas ref={canvasRef} width={320} height={320}
            className="w-full border-2 border-slate-200 rounded-xl bg-slate-50" />
        </div>
      </div>
    </section>
  );
}

const REORDER_BLOCKS = [

// ---------- Flowchart stepper (1.2 Input→Process→Output) ----------
function FlowStepLab() {
  const [input, setInput] = useState(20);
  const [step, setStep] = useState(0);
  const wage = Number(input) || 0;
  const salary = wage * 40 * 52;
  // steps: [lineIndex highlighted, note, varsShown, outputShown]
  const lines = [
    "wage = Get next input",
    "salary = wage * 40 * 52",
    'Put "Salary is " to output',
    "Put salary to output",
  ];
  const shapes = ["input", "process", "output", "output"];
  const states = [
    { note: "Ready. Click Step to begin at the Start node.", vars: {}, out: "" },
    { note: "INPUT: wage gets the next input value (" + wage + ").", vars: { wage }, out: "" },
    { note: "PROCESS: salary = wage × 40 × 52 = " + salary + ".", vars: { wage, salary }, out: "" },
    { note: "OUTPUT: put the string literal \"Salary is \".", vars: { wage, salary }, out: "Salary is " },
    { note: "OUTPUT: put salary's value. Done — reached End.", vars: { wage, salary }, out: "Salary is " + salary },
  ];
  const st = states[step];
  const highlight = step - 1; // which line is active

  return (
    <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <SectionHead>Flowchart stepper</SectionHead>
      <p className="text-slate-600 text-sm mb-4">

        Change the input and re-step.
      </p>
      <div className="flex items-center gap-2 mb-4">
        <label className="text-xs text-slate-500 uppercase tracking-wide">Input</label>
        <input type="number" value={input}
          onChange={(e) => { setInput(e.target.value); setStep(0); }}
          className="w-24 font-mono border-2 border-slate-300 rounded-lg px-2 py-1 focus:border-teal-600 focus:outline-none" />
      </div>
      <div className="flex flex-col md:flex-row gap-4">
        <div className="md:w-1/2 space-y-1.5">
          <div className="text-center font-mono text-xs text-slate-400">( Start )</div>
          {lines.map((ln, i) => (
            <div key={i}
              className={`font-mono text-sm rounded-lg px-3 py-2 border-2 transition-colors ${
                i === highlight ? "bg-teal-600 border-teal-700 text-white"
                : "bg-slate-50 border-slate-200 text-slate-600"} ${shapes[i] === "process" ? "" : "italic"}`}>
              {ln}
              <span className="ml-2 text-[10px] uppercase opacity-70">{shapes[i]}</span>
            </div>
          ))}
          <div className="text-center font-mono text-xs text-slate-400">( End )</div>
        </div>
        <div className="md:w-1/2 space-y-3">
          <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
            <div className="text-xs text-slate-500 uppercase tracking-wide mb-1">Variables</div>
            <div className="font-mono text-sm text-slate-800">
              wage = {st.vars.wage !== undefined ? st.vars.wage : "—"}<br />
              salary = {st.vars.salary !== undefined ? st.vars.salary : "—"}
            </div>
          </div>
          <div className="bg-slate-900 rounded-xl p-3">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-1">Output</div>
            <pre className="font-mono text-sm text-teal-100 whitespace-pre-wrap min-h-6">{st.out || " "}</pre>
          </div>
          <p className="text-sm text-slate-700 bg-teal-50 border border-teal-200 rounded-lg px-3 py-2">{st.note}</p>
          <div className="flex gap-2">
            <button onClick={() => setStep(Math.max(0, step - 1))}
              className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 rounded-lg">← Back</button>
            <button onClick={() => setStep(Math.min(states.length - 1, step + 1))}
              disabled={step >= states.length - 1}
              className="flex-1 bg-teal-700 hover:bg-teal-800 disabled:opacity-40 text-white font-semibold py-2 rounded-lg">Step →</button>
            <button onClick={() => setStep(0)}
              className="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-lg">Reset</button>
          </div>
        </div>
      </div>
    </section>
  );
}

          {EXAMPLES.map((ex) => (

              className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg">{ex.name}</button>
          ))}
        </div>
        <textarea value={code} onChange={(e) => setCode(e.target.value)} spellCheck={false} rows={9}
          className="w-full font-mono text-sm bg-slate-900 text-teal-50 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-teal-500 resize-y" />
        <div className="flex flex-wrap items-end gap-3 mt-3">
          <div className="flex-1 min-w-40">
            <label className="text-xs text-slate-500 uppercase tracking-wide">Input (space-separated)</label>
            <input value={input} onChange={(e) => setInput(e.target.value)}
              className="w-full font-mono border-2 border-slate-300 rounded-lg px-3 py-2 focus:border-teal-600 focus:outline-none" />
          </div>
          <button onClick={run}
            className="bg-teal-700 hover:bg-teal-800 text-white font-semibold px-6 py-2.5 rounded-lg transition-colors">▶ Run</button>
        </div>
      </div>

      {result && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
          <div className="text-xs text-slate-500 uppercase tracking-wide mb-1">Output</div>
          <pre className="bg-slate-100 rounded-xl p-4 font-mono text-sm whitespace-pre-wrap min-h-12 text-slate-900">{result.output || " "}</pre>
          {!result.ok && (
            <p className="mt-2 text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2">{result.error}</p>
          )}
          {result.ok && result.vars && Object.keys(result.vars).length > 0 && (
            <div className="mt-3 flex flex-wrap gap-2">
              {Object.entries(result.vars).map(([k, v]) => (
                <span key={k} className="font-mono text-xs bg-teal-50 text-teal-800 border border-teal-200 rounded-full px-3 py-1">{k} = {v}</span>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---------- Quiz ----------
function Quiz() {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const q = QUIZ[idx];
  const correct = picked === q.answer;
  const next = () => {
    if (idx + 1 >= QUIZ.length) setDone(true);
    else { setIdx(idx + 1); setPicked(null); }
  };
  const restart = () => { setIdx(0); setPicked(null); setScore(0); setDone(false); };

  if (done) {
    const pct = Math.round((score / QUIZ.length) * 100);
    return (
      <div className="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 text-center">
        <div className="font-mono text-6xl font-bold text-slate-900 mb-2">{score}/{QUIZ.length}</div>
        <p className="text-slate-600 mb-1">
          {pct >= 85 ? "Excellent — you've got this chapter down."
            : pct >= 60 ? "Solid. Review the ones you missed and run it again."
            : "Good start — reread the Learn tab, then try again."}
        </p>
        <button onClick={restart} className="mt-4 bg-teal-700 hover:bg-teal-800 text-white font-semibold px-6 py-2.5 rounded-lg">Retake quiz</button>
      </div>
    );
  }
  return (
    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div className="flex justify-between items-center mb-4">
        <span className="font-mono text-xs text-slate-500">Question {idx + 1} of {QUIZ.length}</span>
        <span className="font-mono text-xs text-teal-700 font-semibold">score: {score}</span>
      </div>
      <div className="h-1.5 bg-slate-100 rounded-full mb-5">
        <div className="h-1.5 bg-teal-600 rounded-full transition-all" style={{ width: `${(idx / QUIZ.length) * 100}%` }} />
      </div>
      <p className="text-slate-900 font-medium mb-4 whitespace-pre-wrap">{q.q}</p>
      <div className="space-y-2">
        {q.options.map((opt, i) => {
          let cls = "border-slate-300 bg-slate-50 hover:border-teal-500";
          if (picked !== null) {
            if (i === q.answer) cls = "border-teal-600 bg-teal-50 text-teal-900";
            else if (i === picked) cls = "border-rose-400 bg-rose-50 text-rose-900";
            else cls = "border-slate-200 bg-slate-50 text-slate-400";
          }
          return (
            <button key={i} disabled={picked !== null}
              onClick={() => { setPicked(i); if (i === q.answer) setScore(score + 1); }}
              className={`w-full text-left border-2 rounded-xl px-4 py-3 font-mono text-sm transition-colors ${cls}`}>{opt}</button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`mt-4 rounded-xl px-4 py-3 text-sm ${correct ? "bg-teal-50 border border-teal-200 text-teal-900" : "bg-rose-50 border border-rose-200 text-rose-900"}`}>
          <strong>{correct ? "Correct." : "Not quite."}</strong> {q.why}
        </div>
      )}
      {picked !== null && (
        <button onClick={next} className="mt-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-lg">
          {idx + 1 >= QUIZ.length ? "See results" : "Next →"}
        </button>
      )}
    </div>
  );
}
